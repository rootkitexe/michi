<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Michi — Learn Japanese</title>
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Learn Japanese from zero: kana, grammar, kanji, stroke-order writing practice and spaced reviews.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, serious, encouraging — a good teacher, not a game show
   IDEA: a calligraphy practice notebook; passing a unit earns a vermilion 合格 seal
   PICTURE: a large character written in a practice-grid square, seals along the path
   COLOUR/TYPE: white paper, sumi ink, shu vermilion, ai indigo; Zen Kaku Gothic New + Klee One (textbook hand)
   LAYOUT: slim top bar, continue card with glyph, daily strip, stage path, road to N1 */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0e131c);--sf:light-dark(#f6f5f2,#151c28);--sf2:light-dark(#eceae5,#1d2636);
--line:light-dark(#e3e1db,#283246);--ink:light-dark(#15171c,#eef1f6);--mut:light-dark(#62666f,#9aa4b5);
--shu:light-dark(#d23a25,#ff6c56);--shuS:light-dark(#fcebe7,#3a1e1a);--ai:light-dark(#213f78,#a3bcff);--aiS:light-dark(#e9eef8,#1a2742);
--ok:light-dark(#1b7a4f,#62d49d);--okS:light-dark(#e4f4eb,#15302a);--bad:light-dark(#c2321e,#ff7c68);--badS:light-dark(#fdebe7,#3b1f1c);
--m1:light-dark(#dfe7f6,#22355c);--m2:light-dark(#b7c9ee,#2f4d86);--m3:light-dark(#6f8fd6,#5577c4);--m4:light-dark(#213f78,#a3bcff);
--sh:0 1px 2px rgba(10,15,30,.05),0 10px 30px rgba(10,15,30,.07);--jp:"Zen Kaku Gothic New",system-ui,sans-serif;--hand:"Klee One","Zen Kaku Gothic New",serif}
:root{--c:var(--ai);--cS:var(--aiS);--cM:var(--m2);--fl:light-dark(#ea6a1c,#ff9b55)}
.st-s1{--c:light-dark(#d23c74,#ff8fb4);--cS:light-dark(#fdedf3,color-mix(in srgb,#ff8fb4 8%,#151c28));--cM:light-dark(#f6c3d6,color-mix(in srgb,#ff8fb4 35%,#151c28))}
.st-s2{--c:light-dark(#1a7cbd,#74c3f6);--cS:light-dark(#e6f3fc,color-mix(in srgb,#74c3f6 8%,#151c28));--cM:light-dark(#b9dcf3,color-mix(in srgb,#74c3f6 35%,#151c28))}
.st-s3{--c:light-dark(#bd6a06,#f5b74e);--cS:light-dark(#fdf2e0,color-mix(in srgb,#f5b74e 8%,#151c28));--cM:light-dark(#f4d29a,color-mix(in srgb,#f5b74e 35%,#151c28))}
.st-s4{--c:light-dark(#3c8732,#93d67f);--cS:light-dark(#ebf6e7,color-mix(in srgb,#93d67f 8%,#151c28));--cM:light-dark(#c3e3b9,color-mix(in srgb,#93d67f 35%,#151c28))}
.st-s6{--c:light-dark(#0f7f7a,#5fd3cc);--cS:light-dark(#e3f5f3,color-mix(in srgb,#5fd3cc 8%,#151c28));--cM:light-dark(#b5e3df,color-mix(in srgb,#5fd3cc 35%,#151c28))}
.st-s7{--c:light-dark(#b04f22,#f29b6e);--cS:light-dark(#fbece4,color-mix(in srgb,#f29b6e 8%,#151c28));--cM:light-dark(#f2c9b3,color-mix(in srgb,#f29b6e 35%,#151c28))}
.st-s5{--c:light-dark(#6346c8,#ae99ff);--cS:light-dark(#f0ecfd,color-mix(in srgb,#ae99ff 8%,#151c28));--cM:light-dark(#d2c8f6,color-mix(in srgb,#ae99ff 35%,#151c28))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--jp);overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
a{color:var(--ai)}
.wrap{max-width:1120px;margin:0 auto;padding:0 max(4vw,16px)}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;height:62px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px;font-weight:700;font-size:19px;margin-right:auto}
.seal{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--shu);color:#fff;font:900 19px var(--jp)}
.chip{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-weight:500;white-space:nowrap}
.chip svg{width:18px;height:18px}
.chip.hot{color:var(--fl)}.chip.due{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ico{width:40px;padding:0;justify-content:center}
.ring{width:26px;height:26px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.btn.pri{background:var(--c);border-color:var(--c);color:var(--bg)}
.btn.ai{background:var(--ai);border-color:var(--ai);color:var(--bg)}
.btn.big{min-height:54px;font-size:17px;padding:0 26px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}
main{padding-bottom:80px}
h1,h2,h3{line-height:1.1;text-wrap:balance;margin:0}
.lbl{font-size:14px;color:var(--mut);font-weight:500}
.hero{position:relative;overflow:hidden;background:var(--cS)!important;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(20px,4vw,48px);align-items:center;margin-top:28px;padding:clamp(22px,4vw,44px);background:var(--sf);border-radius:24px}
.hero>div{position:relative;z-index:1}
.wave{position:absolute;right:0;bottom:0;width:100%;height:60%;opacity:.38;pointer-events:none;-webkit-mask-image:linear-gradient(to left,#000 10%,transparent 65%);mask-image:linear-gradient(to left,#000 10%,transparent 65%)}
@media (max-width:600px){.wave{opacity:.28;height:45%}}
.wave circle{fill:var(--cS);stroke:var(--c);stroke-width:1.2}
:root[data-theme=dark] .wave{opacity:.22}@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .wave{opacity:.22}}
.hero .lbl{color:var(--c);font-weight:700}
.hero h1{font-size:clamp(32px,4.6vw,48px);margin:8px 0 10px}
.hero p.d{margin:0 0 18px;color:var(--mut);max-width:52ch}
.steps{display:flex;gap:8px;list-style:none;padding:0;margin:0 0 22px;flex-wrap:wrap}
.steps li{display:flex;align-items:center;gap:7px;padding:7px 12px 7px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:14px;font-weight:500;color:var(--mut)}
.steps li i{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--sf2);font-style:normal;font-size:12px}
.steps li.done{color:var(--ok)}.steps li.done i{background:var(--ok);color:var(--bg)}
.steps li.cur{color:var(--ink);border-color:var(--ink)}.steps li.cur i{background:var(--ink);color:var(--bg)}
.gate{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--aiS);color:var(--ai);font-size:15px}
.pic{display:grid;justify-items:center;gap:12px}
.sq{position:relative;width:min(100%,300px);aspect-ratio:1;background:light-dark(#fff,color-mix(in srgb,var(--c) 5%,#0e131c));border:2px solid var(--c);border-radius:6px;display:grid;place-items:center;box-shadow:var(--sh)}
.sq::before,.sq::after{content:"";position:absolute;inset:0;pointer-events:none}
.sq::before{background:linear-gradient(var(--c),var(--c)) center/100% 1px no-repeat,linear-gradient(var(--c),var(--c)) center/1px 100% no-repeat;opacity:.3}
.sq::after{background:linear-gradient(45deg,transparent calc(50% - .5px),var(--c) 50%,transparent calc(50% + .5px)),linear-gradient(-45deg,transparent calc(50% - .5px),var(--c) 50%,transparent calc(50% + .5px));opacity:.12}
.sq span{position:relative;font:600 clamp(110px,17vw,190px)/1 var(--hand);color:var(--ink)}
.sq.sm span{font-size:clamp(80px,12vw,130px)}
.cap{text-align:center;font-size:15px;color:var(--mut);max-width:32ch;background:light-dark(#fff,color-mix(in srgb,var(--c) 5%,#0e131c));padding:8px 14px;border-radius:12px;box-shadow:var(--sh)}
.cap b{color:var(--ink);font-size:18px}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:18px}
.tile{position:relative;padding:18px;border-radius:18px;border:1px solid var(--line);background:var(--bg)}
.tile .ic{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--cS);color:var(--c);margin-bottom:8px}.tile .ic svg{width:18px;height:18px}
.tile .dot{position:absolute;top:18px;right:18px;width:10px;height:10px;border-radius:50%;background:var(--c)}
.tile .meter i{background:var(--c)}.week b.on{background:var(--c)!important}
.lv:nth-child(2){--c:light-dark(#1a7cbd,#74c3f6)}.lv:nth-child(3){--c:light-dark(#3c8732,#93d67f)}.lv:nth-child(4){--c:light-dark(#bd6a06,#f5b74e)}.lv:nth-child(5){--c:light-dark(#d23c74,#ff8fb4)}
.lv:not(.on) b{color:var(--c)}
/* progress page */
.ph{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;margin-top:20px;padding:clamp(22px,4vw,36px);border-radius:24px;background:var(--sf)}
.ph h1{font-size:clamp(30px,4.4vw,44px);margin:6px 0 8px}.ph p{margin:0;color:var(--mut)}
.rings{display:flex;gap:18px;flex-wrap:wrap}
.rg{position:relative;width:132px;height:132px}.rg svg{width:100%;height:100%}.rg .rb{fill:none;stroke:var(--sf2);stroke-width:9}.rg .rf{fill:none;stroke:var(--c);stroke-width:9;stroke-linecap:round}
.rg>div{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1}.rg b{font-size:26px}.rg span{font-size:13px;font-weight:700;color:var(--c)}.rg small{font-size:11px;color:var(--mut)}
.pt{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-top:16px}.pt .n{font-size:26px}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:16px}
.pc{padding:22px;border-radius:20px;border:1px solid var(--line);background:var(--bg);margin-top:16px}.pgrid .pc{margin-top:0}
.pc h2{font-size:21px;margin-bottom:4px}.pc>.fine{margin:0 0 14px}
.hm{display:grid;gap:4px}.hmm,.hmg{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:3px}.hmm span{font-size:11px;color:var(--mut);white-space:nowrap;overflow:visible}
.hmg{grid-template-rows:repeat(7,auto);grid-auto-flow:column}.hmg i{aspect-ratio:1;border-radius:3px}
.h0,.leg i.h0{background:var(--sf2)}.h1{background:light-dark(#fcd9d1,#4a241e)}.h2{background:light-dark(#f4a491,#86392b)}.h3{background:light-dark(#e5654b,#d4553d)}.h4{background:var(--shu)}.hx{visibility:hidden}
.leg i.h1,.leg i.h2,.leg i.h3,.leg i.h4{border:0}
.bc{position:relative;display:flex;align-items:flex-end;gap:5px;height:150px;padding-bottom:20px}
.bc .b{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
.bc .b i{display:block;width:100%;max-width:26px;border-radius:5px 5px 2px 2px;background:var(--cM,var(--m2));min-height:0}
.bc .b i.met{background:var(--shu)}
.bc .b span{position:absolute;bottom:-20px;font-size:11px;color:var(--mut);white-space:nowrap}
.bc .b em{font-style:normal;font-size:12px;font-weight:700;color:var(--ai);margin-bottom:3px}
.bc.fc .b i{background:var(--ai)}
.gl2{position:absolute;left:0;right:0;border-top:2px dashed var(--shu);opacity:.5;margin-bottom:20px}
.ms{margin-bottom:12px}.msh{display:flex;justify-content:space-between;gap:8px;margin-bottom:5px}.msh b{color:var(--c)}
.sb{display:flex;height:12px;border-radius:8px;background:var(--sf2);overflow:hidden}.sb i{display:block;height:100%}.sb .m1{background:var(--m1)}.sb .m2{background:var(--m2)}.sb .m3{background:var(--m3)}.sb .m4{background:var(--m4)}
.wl{list-style:none;padding:0;margin:0 0 14px}.wl li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}.wl em{font-style:normal;color:var(--bad);font-size:13px;white-space:nowrap}
.tr{margin-bottom:12px}.tr>b{color:var(--c);display:block;margin-bottom:6px}.trs{display:flex;flex-wrap:wrap;gap:6px}
.tp{font-size:13px;padding:5px 10px;border-radius:999px;background:var(--sf);border:1px solid var(--line)}.tp.ok{background:var(--cS);border-color:transparent}.tp b{color:var(--c)}.tp small{color:var(--mut)}
.bg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bdg{padding:14px;border-radius:16px;border:1px dashed var(--line);text-align:center;color:var(--mut)}.bdg b{display:block;font-size:14px;margin-top:8px}.bdg small{font-size:12px}
.bdg .bi{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--sf);font:600 24px var(--hand);opacity:.5}
.bdg.got{border:1px solid transparent;background:var(--cS);color:var(--ink)}.bdg.got .bi{background:var(--c);color:var(--bg);opacity:1}.bdg.got small{color:var(--mut)}
.pst{margin-top:14px}.pst summary{cursor:pointer;color:var(--ai);font-weight:500}.pst textarea{width:100%;margin:10px 0;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:13px ui-monospace,monospace;padding:10px}
label.btn{cursor:pointer}
.newb{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}.newb .bdg{min-width:160px}
.plink{color:var(--c);display:inline-block;margin-top:10px;font-size:14px;font-weight:500}
.tile .n{font-size:30px;font-weight:700;line-height:1.1;margin-top:4px}
.tile .n small{font-size:15px;color:var(--mut);font-weight:500}
.meter{height:10px;border-radius:9px;background:var(--sf2);overflow:hidden;margin-top:12px}
.meter i{display:block;height:100%;background:var(--shu);border-radius:9px;transition:width .5s}
.week{display:flex;gap:5px;align-items:flex-end;height:38px;margin-top:10px}
.week div{flex:1;display:grid;gap:3px;justify-items:center;font-size:11px;color:var(--mut)}
.week b{display:block;width:100%;border-radius:4px;background:var(--sf2)}
.week b.on{background:var(--shu)}
.tile button.lk{margin-top:10px;width:100%}
.sec{margin-top:44px}
.sec>h2{font-size:28px;margin-bottom:6px}
.sec>p{margin:0 0 18px;color:var(--mut)}
.stage{margin-top:26px}
.sh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sh h3{font-size:22px}.sh .jp{font:600 18px var(--hand);color:var(--mut)}
.sh .tag{font-size:13px;padding:3px 9px;border-radius:999px;background:var(--cS);color:var(--c);font-weight:700}
.sh h3{color:var(--ink)}.sh .jp{color:var(--c)!important}
.sp{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}.sp i{display:block;width:90px;height:7px;border-radius:7px;background:var(--sf2);overflow:hidden}.sp i b{display:block;height:100%;background:var(--c);border-radius:7px}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.unit{position:relative;display:flex;gap:14px;align-items:center;text-align:left;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--bg);min-height:84px}
.unit:hover:not(:disabled){border-color:var(--c);transform:translateY(-1px)}
.unit{transition:transform .15s,border-color .15s}
.unit .g{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:12px;background:var(--cS);color:var(--c);font:600 26px var(--hand)}
.unit .t{font-weight:700;line-height:1.25}
.unit .s{font-size:13px;color:var(--mut);margin-top:2px}
.unit.cur{border:2px solid var(--c);box-shadow:var(--sh)}
.unit.cur .g{background:var(--cS);color:var(--c);box-shadow:inset 0 0 0 2px var(--c)}
.unit.lock{opacity:.55;cursor:not-allowed}
.unit.lock .g{background:var(--sf);color:var(--mut)}
.stamp{position:absolute;right:10px;top:50%;translate:0 -50%;rotate:-10deg;width:46px;height:46px;border:2.5px solid var(--shu);border-radius:50%;display:grid;place-items:center;color:var(--shu);font:900 13px/1 var(--jp);writing-mode:vertical-rl;letter-spacing:1px;opacity:.9}
.unit.passed>span:nth-child(2){padding-right:44px}
.road{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.lv{padding:16px;border-radius:16px;background:var(--sf);border:1px solid var(--line)}
.lv b{font-size:24px;display:block}
.lv span{font-size:13px;color:var(--mut);display:block;margin-top:4px}
.lv.on{background:var(--ai);color:var(--bg);border-color:var(--ai)}.lv.on span{color:inherit;opacity:.85}
.fine{font-size:13px;color:var(--mut);margin-top:10px}
/* unit page */
.up{margin-top:28px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:start}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--mut);padding:8px 0;font-weight:500}
.stepc{display:flex;gap:14px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:16px;margin-top:12px;background:var(--bg)}
.stepc .no{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--sf2);font-weight:700}
.stepc.done .no{background:var(--ok);color:var(--bg)}
.stepc .tx{flex:1}.stepc .tx b{display:block}.stepc .tx span{font-size:14px;color:var(--mut)}
.stepc .btn{flex:none;min-height:42px;padding:0 16px}
.links{margin-top:18px;padding:16px;border-radius:16px;background:var(--sf)}
.links a{display:block;margin-top:6px}
/* lesson */
.lesson{max-width:760px;margin:24px auto 0}
.lbar{display:flex;align-items:center;gap:12px}
.dots{flex:1;display:flex;gap:4px}
.dots i{flex:1;height:6px;border-radius:6px;background:var(--sf2)}
.dots i.on{background:var(--c)}
.card{margin-top:18px;padding:clamp(22px,4vw,40px);border-radius:24px;background:var(--cS);min-height:380px}
.card h2{font-size:clamp(26px,3.6vw,36px);margin-bottom:14px}
.card p{margin:0 0 14px;max-width:62ch}
.card .tip{padding:12px 14px;border-left:3px solid var(--c);background:var(--bg);border-radius:0 10px 10px 0;margin:14px 0}
.exs{display:grid;gap:8px;margin-top:14px}
.ex{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg);border-radius:12px;border:1px solid var(--line)}
.ex .j{font-size:20px;font-weight:500}
.ex .r{font-size:13px;color:var(--mut)}
.ex .e{margin-left:auto;text-align:right;color:var(--mut);font-size:15px}
.spk{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);padding:0}
.spk svg{width:18px;height:18px}
.charc{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
.charc .big{font-size:56px;font-weight:700;line-height:1}
.tbl{width:100%;border-collapse:collapse;margin-top:10px;background:var(--bg);border-radius:12px;overflow:hidden}
.tbl td,.tbl th{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{font-size:13px;color:var(--mut);font-weight:500}
.tbl .jj{font-size:19px}
.lnav{display:flex;justify-content:space-between;gap:12px;margin-top:16px}
/* session */
.ses{max-width:760px;margin:20px auto 0}
.stop{display:flex;align-items:center;gap:14px}
.bar{flex:1;height:12px;border-radius:9px;background:var(--sf2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:9px;transition:width .35s}
.mode{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--cS);color:var(--c);white-space:nowrap}

const KM={'ア':'An axe chopping down: a.','イ':'An easel leaning against a wall: i.','ウ':'う with corners, like a person in a crown: u.','エ':'An elevator\'s I-beam: e.','オ':'An opera singer with arms out wide: o.','カ':'か without the spark: a sharp blade, ka.','キ':'A key with two teeth, like き but straighter.','ク':'A cook\'s hat from the side: ku.','ケ':'A K tipped over: ke.','コ':'A corner: ko.','サ':'A signpost on two legs: sa.','シ':'She smiles: the strokes rise from the bottom-left, like a smile.','ス':'A superhero\'s flowing cape: su.','セ':'Like せ, a sail: se.','ソ':'A needle dropping from the top: so. Strokes fall downward.','タ':'ク with an extra stroke inside: ta.','チ':'A cheerleader waving a pom-pom: chi.','ツ':'A tsunami falling from above: strokes come down from the top.','テ':'A telephone pole: te.','ト':'A totem pole with one branch: to.','ナ':'A knife: na.','ニ':'Two lines; ni also means "two".','ヌ':'Chopsticks pinching noodles: nu.','ネ':'A necklace on a display stand: ne.','ノ':'One slash: "No!"','ハ':'Two lines splitting with laughter: ha.','ヒ':'A heel kicking right: hi.','フ':'A hook hanging from the ceiling: fu.','ヘ':'The same as hiragana へ: he.','ホ':'A holy cross with arms: ho.','マ':'A mama\'s face seen from the side: ma.','ミ':'Three lines: mi, like "me, 3".','ム':'A cow\'s nose: mu.','メ':'An X marking the spot: me.','モ':'More lines than ミ, with a hook: mo.','ヤ':'A yacht\'s sail: ya.','ユ':'A U-turn on a road: yu.','ヨ':'A stack of yo-yos: yo.','ラ':'A rabbit\'s ear sticking up: ra.','リ':'Like hiragana り: reeds.','ル':'Two roots: ru.','レ':'A rail curving upward: re.','ロ':'A square road sign: ro.','ワ':'A wine glass on its side: wa.','ヲ':'ワ with an extra bar. Read "o"; you will rarely see it.','ン':'Like ソ, but the long stroke sweeps up from the bottom: n.'};
function mn(c){if(HM[c])return HM[c];if(KM[c])return KM[c];const k=KD[c];if(!k)return'';
 const f=FOREIGN.find(x=>x[0]===c);if(f)return`A katakana-only combination used for foreign sounds: ${k.r}.`;
 if(c.length===2)return`${c[0]} (${KD[c[0]].r}) + small ${c[1]} blend into one beat: ${k.r}.`;
 const d=c.normalize('NFD');if(d.length>1){const b=d[0];return d[1]==='゚'?`${b} (${KD[b].r}) + the little circle ゜ turns h into p: ${k.r}.`:`${b} (${KD[b].r}) + the two dots ゛ make it voiced: ${k.r}.`}
 return''}

function toKana(s){s=s.toLowerCase().replace(/[āâ]/g,'aa').replace(/[ōô]/g,'ou').replace(/[ūû]/g,'uu').replace(/[ēê]/g,'ee').replace(/[īî]/g,'ii');let o='',i=0;
 while(i<s.length){const c=s[i],n1=s[i+1];
  if(c==='n'){if(n1===undefined){o+='ん';i++;continue}if(n1==="'"){o+='ん';i+=2;continue}
   if(n1==='n'){const n2=s[i+2];if(n2!==undefined&&/[aiueoy]/.test(n2)){o+='ん';i++}else{o+='ん';i+=2}continue}
   if(!/[aiueoy]/.test(n1)){o+='ん';i++;continue}}
  if(/[bcdfghjkmpqrstvwxz]/.test(c)&&c===n1){o+='っ';i++;continue}
  if(c==='t'&&n1==='c'&&s[i+2]==='h'){o+='っ';i++;continue}
  let m=false;for(let L=3;L>0;L--){const k=s.substr(i,L);if(R2H[k]){o+=R2H[k];i+=L;m=true;break}}
  if(!m){o+=c==='-'?'ー':c;i++}}
 return o}
const PART={'は':'wa','へ':'e','を':'o'};
function romTok(t){if(PART[t])return PART[t];const h=toHira(t);let o='';
 if(h==='こんにちは'||h==='こんばんは')return romTok(t.slice(0,-1))+'wa';
 for(let i=0;i<h.length;i++){const c=h[i],n=h[i+1];
  if(n&&/[ゃゅょぁぃぅぇぉ]/.test(n)&&H2R[c+n]){o+=H2R[c+n];i++;continue}
  if(c==='っ'){const nx=romTok(h.slice(i+1,i+3));o+=nx?(nx.startsWith('ch')?'t':nx[0]):'';continue}
  if(c==='ー'){const m=o.match(/[aiueo]$/);o+=m?m[0]:'-';continue}
  if(c==='を'){o+='o';continue}
  o+=H2R[c]!==undefined?H2R[c]:c}
 return o}
const toRomaji=s=>s.split(/(\s+)/).map(t=>/\s/.test(t)?' ':romTok(t)).join('').replace(/[。、]/g,m=>m==='。'?'.':',');
const normK=(s,len)=>{s=toHira(s).replace(/[\s。、？！?!.,]/g,'');if(len)s=s.replace(/は/g,'わ').replace(/を/g,'お').replace(/へ/g,'え');return s};

 words:W([['アイス','ice cream'],['ココア','cocoa'],['スイス','Switzerland'],['ケア','care'],['オアシス','oasis'],['キス','kiss']]),
 intro:[{h:'Same sounds, sharper shapes',p:['Katakana has exactly the same sounds as hiragana, written with straight, angular strokes.','It is used for words from other languages (コーヒー, coffee), foreign names, sound effects and emphasis, a bit like italics in English.'],tip:'Several katakana look like their hiragana twin: カ/か, キ/き, セ/せ, へ/ヘ. Use that.'},
  {h:'Your first katakana words',p:['Most katakana words are English words reshaped to fit Japanese sounds. Read them out loud and the meaning often jumps out.'],ex:[['アイス','ice cream'],['ココア','cocoa']]}]},
{id:'k2',st:'s2',t:'Katakana T, N, H rows',sub:'タ ナ ハ',g:'ツ',kind:'kana',chars:C('タチツテトナニヌネノハヒフヘホ'),
 words:W([['テニス','tennis'],['テキスト','textbook'],['ナイフ','knife'],['ソフト','soft; software'],['ツナ','tuna'],['ネクタイ','necktie'],['ヘア','hair (styling)']]),
 intro:[{h:'The famous trap: シ and ツ',p:['シ (shi) and ツ (tsu) confuse almost every learner. Look at the direction of the strokes.','<b>シ</b>: the dots sit on the left and the long stroke sweeps <b>up</b> from the bottom.<br><b>ツ</b>: the dots sit on top and the long stroke falls <b>down</b> from the top.'],tip:'ソ (so) and ン (n) follow the same rule: ソ falls down from the top, ン sweeps up from the bottom.',ex:[['テニス','tennis'],['ツナ','tuna']]}]},
{id:'k3',st:'s2',t:'Katakana M, Y, R, W rows',sub:'マ ヤ ラ ワ ン',g:'ン',kind:'kana',chars:C('マミムメモヤユヨラリルレロワヲン'),
 words:W([['トマト','tomato'],['ホテル','hotel'],['カメラ','camera'],['メロン','melon'],['レモン','lemon'],['ミルク','milk'],['ワイン','wine'],['アメリカ','America']]),
 intro:[{h:'Finishing the basic set',p:['With these rows you will know all 46 basic katakana. ヲ exists but you will almost never see it outside textbooks.'],tip:'ン vs ソ again: ン sweeps up from the bottom-left, ソ drops from the top.',ex:[['カメラ','camera'],['ホテル','hotel']]}]},
{id:'k4',st:'s2',t:'Voiced katakana, ッ and ー',sub:'ガ パ · ッ · ー',g:'ー',kind:'kana',chars:C('ガギグゲゴザジズゼゾダヂヅデドバビブベボパピプペポ'),
 words:W([['コーヒー','coffee'],['テレビ','TV'],['パン','bread'],['バス','bus'],['ゲーム','game'],['ベッド','bed'],['ラーメン','ramen'],['インターネット','internet'],['スーパー','supermarket'],['ピザ','pizza']]),
 intro:[{h:'Same rules as hiragana',p:['゛ and ゜ work exactly as they do in hiragana: カ→ガ, サ→ザ, タ→ダ, ハ→バ, ハ→パ. A small ッ also doubles the next consonant.'],ex:[['テレビ','TV'],['ベッド','bed']]},
  {h:'The long bar ー',p:['Katakana marks long vowels with a dash, ー. It stretches the vowel before it for one more beat.','Horizontal text uses a horizontal bar. In vertical text it becomes a vertical line.'],ex:[['コーヒー','coffee'],['ラーメン','ramen']],tip:'コーヒー is ko-o-hi-i: four beats. Say it slowly before you say it fast.'}]},
{id:'k5',st:'s2',t:'Katakana combos and foreign sounds',sub:'シャ チュ · ファ ティ',g:'フ',kind:'kana',chars:[...COMBOS_H.map(toKata),...FOREIGN.map(f=>f[0])],
 words:W([['シャツ','shirt'],['チーズ','cheese'],['ジュース','juice'],['コンピューター','computer'],['パーティー','party'],['フォーク','fork'],['ウェブ','web'],['チェック','check'],['メニュー','menu']]),
 intro:[{h:'Combos work the same',p:['キャ, シュ, チョ and friends blend into one beat exactly like their hiragana versions.'],ex:[['シャツ','shirt'],['メニュー','menu']]},
  {h:'New sounds for foreign words',p:['Japanese has no native "fa", "ti" or "we", so katakana builds them by adding a small vowel: フ + small ァ = ファ (fa).'],tbl:[['ファ フィ フェ フォ','fa fi fe fo',''],['ティ ディ','ti di','パーティー = party'],['ウィ ウェ ウォ','wi we wo',''],['チェ シェ ジェ','che she je','チェック = check']]}]},

 intro:[{h:'Prove you own katakana',p:['Every katakana character and word you have met, mixed together. Score 90% to unlock your first grammar.'],tip:'Watch out for シ/ツ and ソ/ン. They are the most-missed characters on this exam.'}]},
{id:'g1',st:'s3',t:'Greetings and courtesy',sub:'こんにちは · ありがとう',g:'お',kind:'gram',
 words:W([['おはよう ございます','Good morning (polite)'],['こんにちは','Hello; good afternoon'],['こんばんは','Good evening'],['ありがとう ございます','Thank you (polite)'],['すみません','Excuse me; sorry'],['おやすみなさい','Good night'],['さようなら','Goodbye'],['はい','yes'],['いただきます','said before eating'],['ごちそうさまでした','said after eating'],['はじめまして','Nice to meet you'],['よろしく おねがいします','Please treat me kindly']]),
 intro:[{h:'Politeness is built into the language',p:['Japanese changes its words depending on who you are talking to. Polite forms (ending in ございます or ます) are for strangers, teachers, shop staff and colleagues. Casual forms are for friends and family.','Learn the polite form first. It is always safe.']},
  {h:'Greetings through the day',ex:[['おはよう ございます','Good morning'],['こんにちは','Hello, good afternoon'],['こんばんは','Good evening'],['おやすみなさい','Good night (before bed)'],['さようなら','Goodbye (for a longer parting)']],p:['The は at the end of こんにちは and こんばんは is read <b>wa</b>. That is the same grammar particle you will meet in the next unit.']},
  {h:'Thanks, sorry and meals',ex:[['ありがとう ございます','Thank you'],['すみません','Excuse me, sorry, and sometimes thank you'],['いただきます','Said before eating ("I humbly receive")'],['ごちそうさまでした','Said after eating ("Thank you for the meal")']],tip:'すみません does triple duty: getting attention, apologising, and thanking someone who went to trouble for you.'},
  {h:'Meeting someone new',ex:[['はじめまして','Nice to meet you (first time only)'],['よろしく おねがいします','Please treat me kindly (closes an introduction)']],p:['A Japanese self-introduction opens with はじめまして and closes with よろしく おねがいします. In the next units you will fill in the middle.']}],
 qs:[{t:'mc',q:'It\'s 8 a.m. and you meet your teacher. What do you say?',o:['おはよう ございます','こんばんは','おやすみなさい','いただきます'],why:'おはよう ございます is the polite "good morning".'},
  {t:'mc',q:'You bump into someone on a crowded train. What do you say?',o:['すみません','ありがとう','はじめまして','はい'],why:'すみません works for "sorry" and "excuse me".'},
  {t:'mc',q:'Your food has just arrived and you\'re about to eat.',o:['いただきます','ごちそうさまでした','さようなら','こんにちは'],why:'いただきます is said before eating; ごちそうさまでした after.'},
  {t:'mc',q:'You are meeting someone for the very first time.',o:['はじめまして','おはよう ございます','すみません','おやすみなさい'],why:'はじめまして is only used on a first meeting.'},
  {t:'mc',q:'In こんにちは, how is the final は pronounced?',o:['wa','ha','ho','o'],why:'It is the particle は, which is always read "wa".'},
  {t:'mc',q:'Which is the polite way to say thank you?',o:['ありがとう ございます','ありがとう','おやすみなさい','さようなら'],why:'Adding ございます makes ありがとう polite.'},
  {t:'mc',q:'It\'s 7 p.m. and you arrive at a dinner with your friend\'s parents.',o:['こんばんは','おはよう ございます','おやすみなさい','いただきます'],why:'こんばんは is the evening greeting.'},
  {t:'mc',q:'You have just finished a meal at a friend\'s house.',o:['ごちそうさまでした','いただきます','はじめまして','こんばんは'],why:'ごちそうさまでした thanks the host after eating.'},
  {t:'build',en:'Nice to meet you. Please treat me kindly.',tiles:['はじめまして','よろしく','おねがいします'],x:['ありがとう'],why:'The classic opening and closing of a self-introduction.'},
  {t:'type',q:'Write in Japanese: "yes"',a:['はい'],why:'はい = yes. いいえ = no.'},
  {t:'type',q:'Write in Japanese: "no"',a:['いいえ'],why:'いいえ = no. In real conversation people often soften it, but you will learn that later.'}]},
{id:'g2',st:'s3',t:'A は B です',sub:'わたし は がくせい です',g:'は',kind:'gram',
 words:W([['がくせい','student'],['せんせい','teacher'],['かいしゃいん','office worker'],['いしゃ','doctor'],['にほんじん','Japanese person'],['インドじん','Indian person'],['アメリカじん','American person'],['にほんご','Japanese (language)'],['なまえ','name']]),
 intro:[{h:'The core sentence: A は B です',p:['This one pattern carries you a long way. <b>A は B です</b> means "A is B".','は marks the <b>topic</b>, what you are talking about ("as for A..."). です politely means "is / am / are" and closes the sentence.'],ex:[['わたし は がくせい です。','I am a student.'],['たなかさん は せんせい です。','Tanaka is a teacher.']]},
  {h:'Written は, spoken "wa"',p:['When は is used as the topic particle, it is pronounced <b>wa</b>. Everywhere else (はな, ほん) it is still "ha".','In these lessons particles are written with a space around them to help you spot them. Real Japanese has no spaces.'],tip:'When typing answers here, you can type the particle as "wa" or "ha". Both are accepted.'},
  {h:'Leave out what\'s obvious',p:['Japanese drops anything clear from context, especially "I". がくせい です on its own means "(I) am a student".','There are also no words for "a" or "the", and nouns usually have no plural: がくせい can mean a student, the student, or students.'],ex:[['がくせい です。','(I) am a student.']]},
  {h:'Names, さん and nationalities',p:['Add <b>さん</b> after other people\'s names to be polite, like Mr. or Ms. Never use it with your own name.','Country + <b>じん</b> = a person from that country. Country + <b>ご</b> = that country\'s language.'],ex:[['インドじん','Indian person'],['にほんじん','Japanese person'],['にほんご','Japanese language']]}],
 qs:[{t:'fill',jp:'わたし ＿ がくせい です。',en:'I am a student.',o:['は','を','か','の'],why:'は marks the topic: what the sentence is about. It is written は but read "wa".'},
  {t:'mc',q:'What does this mean?',jp:'たなかさん は せんせい です。',o:['Tanaka is a teacher.','I am Tanaka.','Tanaka is a student.','Is Tanaka a teacher?'],why:'たなかさん (Tanaka) は (topic) せんせい (teacher) です (is).'},
  {t:'mc',q:'How do you say "I am Indian"?',o:['わたし は インドじん です。','わたし は インドご です。','わたし は インド です。','インド は わたし です。'],why:'Country + じん = a person from there. インド alone is the country, and ～ご is a language.'},
  {t:'build',en:'I am a doctor.',tiles:['わたし','は','いしゃ','です'],x:['を','か'],why:'Pattern: A は B です.'},
  {t:'build',en:'Mr. Sato is an office worker.',tiles:['さとうさん','は','かいしゃいん','です'],x:['わたし','か'],why:'さん goes after someone else\'s name.'},
  {t:'mc',q:'Ryu is introducing himself. Which sentence is NOT natural?',o:['わたし は りゅうさん です。','わたし は りゅう です。','りゅう です。','わたし は がくせい です。'],why:'Never add さん to your own name. It shows respect to other people.'},
  {t:'mc',q:'In わたし は がくせい です, what does です do?',o:['Politely says "am / is / are"','Marks the topic','Turns it into a question','Means "I"'],why:'です is the polite "to be" at the end of the sentence.'},
  {t:'mc',q:'がくせい です。 What is the most natural translation?',o:['(I) am a student.','The student.','Students are.','Is it a student?'],why:'Japanese drops "I" when it is obvious from context.'},
  {t:'fill',jp:'たなかさん ＿ にほんじん です。',en:'Tanaka is Japanese.',o:['は','です','か','さん'],why:'The topic (たなかさん) is followed by は.'},
  {t:'type',q:'Write in Japanese: "I am a student."',a:['わたし は がくせい です'],why:'わたし は がくせい です. You can type the particle は as "wa" or "ha".'}]},
{id:'g3',st:'s3',t:'Questions, "not", and の',sub:'か · じゃ ありません · の',g:'か',kind:'gram',
 words:W([['そう です','That\'s right.'],['ちがいます','That\'s not right.'],['だいがく','university'],['だいがくせい','university student'],['こうこうせい','high school student'],['ほん','book']]),
 intro:[{h:'Questions: just add か',p:['To turn a statement into a question, add <b>か</b> at the end. The word order stays exactly the same. Your voice rises a little at the end.','Polite Japanese often ends a question with 。 rather than ？.'],ex:[['たなかさん は がくせい です か。','Is Tanaka a student?']]},
  {h:'Answering yes or no',ex:[['はい、そう です。','Yes, that\'s right.'],['いいえ、ちがいます。','No, that\'s not right.']],p:['These two answers work for almost any A は B です question.']},
  {h:'Saying "is not"',p:['The negative of です is <b>じゃ ありません</b>. The more formal, written version is <b>では ありません</b>. They mean the same thing.'],ex:[['わたし は せんせい じゃ ありません。','I am not a teacher.']]},
  {h:'の links two nouns',p:['<b>A の B</b> means "A\'s B" or "B of A". B is the main thing, and A describes it.'],ex:[['わたし の なまえ','my name'],['にほんご の せんせい','a Japanese-language teacher'],['たなかさん の ほん','Tanaka\'s book']]},
  {h:'Your first self-introduction',ex:[['はじめまして。','Nice to meet you.'],['わたし の なまえ は アナ です。','My name is Ana.'],['インドじん です。','I\'m Indian.'],['だいがくせい です。','I\'m a university student.'],['よろしく おねがいします。','Please treat me kindly.']],tip:'Swap in your own name and details. You can already introduce yourself in Japanese!'}],
 qs:[{t:'mc',q:'Turn "やまださん は いしゃ です。" into a question.',o:['やまださん は いしゃ です か。','やまださん か いしゃ です。','か やまださん は いしゃ です。','やまださん は いしゃ か です。'],why:'Just add か at the very end. The word order never changes.'},
  {t:'mc',q:'What does this mean?',jp:'わたし は せんせい じゃ ありません。',o:['I am not a teacher.','I am a teacher.','Am I a teacher?','The teacher is not me.'],why:'じゃ ありません is the negative of です.'},
  {t:'fill',jp:'わたし ＿ なまえ は アナ です。',en:'My name is Ana.',o:['の','は','か','を'],why:'の links two nouns: わたし の なまえ = my name.'},
  {t:'fill',jp:'たなかさん は がくせい です ＿。',en:'Is Tanaka a student?',o:['か','の','は','を'],why:'か at the end makes a question.'},
  {t:'mc',q:'Someone asks たなかさん は にほんじん です か。 Tanaka IS Japanese. How do you answer?',o:['はい、そう です。','いいえ、ちがいます。','はい、ちがいます。','いいえ、そう です。'],why:'はい、そう です = Yes, that\'s right.'},
  {t:'build',en:'I am not a student.',tiles:['わたし','は','がくせい','じゃ','ありません'],x:['です','か'],why:'じゃ ありません replaces です in the negative.'},
  {t:'build',en:'My friend\'s name is Ken.',tiles:['わたし','の','ともだち','の','なまえ','は','ケン','です'],x:['か'],why:'Chains of の are fine: my → friend\'s → name.'},
  {t:'mc',q:'What does にほんご の せんせい mean?',o:['a Japanese-language teacher','Japan\'s teacher','the teacher\'s Japanese','a Japanese student'],why:'In A の B, B is the main thing: a teacher of Japanese.'},
  {t:'type',q:'Write in Japanese: "Is it a book?"',a:['ほん です か'],why:'ほん (book) + です + か.'},
  {t:'mc',q:'Which is the most formal way to say "is not"?',o:['では ありません','じゃ ありません','ちがいます','です か'],why:'では ありません is formal or written; じゃ ありません is the everyday spoken version.'}]},
{id:'g4',st:'s3',t:'This, that, which',sub:'これ それ あれ どれ',g:'こ',kind:'gram',
 words:W([['これ','this one (near me)'],['それ','that one (near you)'],['あれ','that one over there'],['どれ','which one?'],['この','this ~ (before a noun)'],['その','that ~ (before a noun)'],['あの','that ~ over there (before a noun)'],['かさ','umbrella'],['とけい','watch; clock'],['だれ','who'],['なん','what']]),
 intro:[{h:'Ko-so-a-do: the pointing system',p:['Japanese points with four prefixes, and they come back again and again in places, directions and more.'],tbl:[['これ','this one','near me (the speaker)'],['それ','that one','near you (the listener)'],['あれ','that one over there','far from both of us'],['どれ','which one?','the question word']]},
  {h:'これ vs この',p:['<b>これ</b> stands alone as a noun. <b>この</b> must be followed by a noun. The same goes for それ/その, あれ/あの, どれ/どの.'],ex:[['これ は ほん です。','This is a book.'],['この ほん は わたし の です。','This book is mine.']]},
  {h:'Asking what, who and whose',ex:[['これ は なん です か。','What is this?'],['あの ひと は だれ です か。','Who is that person over there?'],['この かばん は だれ の です か。','Whose bag is this?']],p:['だれ の = whose. Also, わたし の can stand alone as "mine" when the thing is already clear.']}],
 qs:[{t:'mc',q:'The book is in YOUR hand, not mine. I ask "＿ は なん です か。" Which word fits?',o:['それ','これ','あれ','どれ'],why:'それ points to something near the listener.'},
  {t:'mc',q:'A building is far from both of us. Which word points to it?',o:['あれ','それ','これ','どれ'],why:'あれ = far from both speaker and listener.'},
  {t:'fill',jp:'＿ かさ は わたし の です。',en:'This umbrella is mine.',o:['この','これ','どれ','あれ'],why:'A noun (かさ) follows, so you need この, not これ.'},
  {t:'fill',jp:'＿ は なん です か。',en:'What is this?',o:['これ','この','その','どの'],why:'No noun follows, so use これ.'},
  {t:'mc',q:'What does this mean?',jp:'あの ひと は だれ です か。',o:['Who is that person over there?','What is that over there?','Who am I?','Which person is it?'],why:'あの ひと = that person over there; だれ = who.'},
  {t:'build',en:'Whose bag is this?',tiles:['この','かばん','は','だれ','の','です','か'],x:['これ','なん'],why:'だれ の = whose.'},
  {t:'build',en:'That (near you) is my watch.',tiles:['それ','は','わたし','の','とけい','です'],x:['その','か'],why:'それ stands alone; わたし の とけい = my watch.'},
  {t:'type',q:'Write in Japanese: "What is that over there?"',a:['あれ は なん です か'],why:'あれ (that over there) は なん (what) です か.'},
  {t:'mc',q:'Which word must be followed by a noun?',o:['その','それ','あれ','どれ'],why:'その, この, あの and どの always come before a noun.'},
  {t:'mc',q:'その かさ は わたし の です。 What does わたし の mean here?',o:['mine','me','my umbrella is','I am'],why:'わたし の can stand alone as "mine".'}]},
{id:'g5',st:'s3',t:'Numbers 0 to 100',sub:'いち に さん …',g:'に',kind:'num',

  {h:'11 to 99 is pure logic',p:['Japanese numbers are built like a formula: tens digit + じゅう + ones digit.'],tbl:[['11','じゅう + いち','じゅういち'],['20','に + じゅう','にじゅう'],['35','さん + じゅう + ご','さんじゅうご'],['47','よん + じゅう + なな','よんじゅうなな'],['99','きゅう + じゅう + きゅう','きゅうじゅうきゅう']],tip:'Use よん, なな and きゅう when building tens: よんじゅう, ななじゅう, きゅうじゅう.'},

{id:'v1',st:'s4',t:'Polite verbs: ます and ません',sub:'すし を たべます',g:'ま',kind:'gram',drill:{t:'masu',L:VB.slice(0,14)},
 words:W([['たべます','eat'],['のみます','drink'],['みます','see, watch'],['ききます','listen, hear'],['よみます','read'],['かきます','write'],['かいます','buy'],['します','do'],['いきます','go'],['きます','come'],['かえります','go home'],['おきます','get up'],['ねます','sleep, go to bed'],['はなします','speak'],['えいが','movie'],['べんきょう します','study'],['おさけ','alcohol, sake']]),
 intro:[{h:'The verb comes last',p:['Japanese sentences put the verb at the very end: <b>who, what, then the action</b>.','English says "I eat sushi"; Japanese says "I sushi eat".'],ex:[['わたし は すし を たべます。','I eat sushi.']]},
  {h:'～ます is present and future',p:['The polite form ends in <b>ます</b>. One form covers both "I do" and "I will do". A time word tells you which one is meant.'],ex:[['まいにち コーヒー を のみます。','I drink coffee every day.'],['あした テニス を します。','I will play tennis tomorrow.']]},
  {h:'Negative: ～ません',p:['Swap ます for <b>ません</b> to say you don\'t (or won\'t) do something.'],tbl:[['たべます','eat','たべません · don\'t eat'],['のみます','drink','のみません · don\'t drink'],['します','do','しません · don\'t do']],ex:[['おさけ を のみません。','I don\'t drink alcohol.']]},
  {h:'を marks the object',p:['<b>を</b> (read "o") marks the thing the action is done to: what you eat, read, buy or watch.'],ex:[['ほん を よみます。','I read a book.'],['えいが を みます。','I watch a movie.']],tip:'Verbs of motion like いきます and きます don\'t take を for the destination. You\'ll learn their particle in the next unit.'},
  {h:'Asking what someone does',p:['なに (what) + を + verb + か makes a natural question.'],ex:[['なに を たべます か。','What will you eat?'],['あした なに を します か。','What will you do tomorrow?']]}],
 qs:[{t:'fill',jp:'わたし は パン ＿ たべます。',en:'I eat bread.',o:['を','は','か','の'],why:'を marks the object: the thing being eaten.'},
  {t:'mc',q:'What does this mean?',jp:'コーヒー を のみません。',o:['I don\'t drink coffee.','I drink coffee.','I drank coffee.','Do you drink coffee?'],why:'のみません is the negative of のみます.'},
  {t:'mc',q:'Which sentence has the correct word order?',o:['わたし は ほん を よみます。','わたし は よみます ほん を。','よみます わたし は ほん を。','ほん を わたし よみます は。'],why:'Topic, then object, then the verb at the end.'},
  {t:'build',en:'I will watch a movie tomorrow.',tiles:['あした','えいが','を','みます'],x:['は','ません'],why:'あした makes ます mean future.'},
  {t:'mc',q:'あした テニス を します。 When does this happen?',o:['Tomorrow','Yesterday','Only right now','Every day'],why:'ます covers the future when a future time word is present.'},
  {t:'type',q:'Write in Japanese: "What will you eat?"',a:['なに を たべます か'],why:'なに を たべます か.'},
  {t:'mc',q:'Your friend asks おさけ を のみます か。 You don\'t drink. What do you answer?',o:['いいえ、のみません。','はい、のみません。','いいえ、のみます。','のみます か。'],why:'いいえ + the negative verb.'},
  {t:'fill',jp:'まいにち にほんご ＿ べんきょう します。',en:'I study Japanese every day.',o:['を','で','に','は'],why:'にほんご is what you study, so it takes を.'}]},
{id:'v2',st:'s4',t:'Where, when, with whom',sub:'に へ で と',g:'で',kind:'gram',
 words:W([['うち','home'],['としょかん','library'],['レストラン','restaurant'],['あるいて','on foot'],['ひとり で','alone'],['かぞく','family'],['なんじ','what time'],['しちじ','7 o\'clock'],['まいにち','every day']]),
 intro:[{h:'に: at a specific time',p:['Clock times, days and dates take <b>に</b>.','Relative time words such as きょう, あした and まいにち take no particle.'],ex:[['しちじ に おきます。','I get up at 7 o\'clock.'],['まいにち べんきょう します。','I study every day.']]},
  {h:'に or へ: where you go',p:['With verbs of motion, the destination takes <b>に</b> or <b>へ</b>. へ is written へ but read "e". Both mean "to".'],ex:[['がっこう に いきます。','I go to school.'],['うち へ かえります。','I go home.']]},
  {h:'で: where something happens',p:['<b>で</b> marks the place where an action takes place.'],ex:[['としょかん で ほん を よみます。','I read books at the library.']],tip:'Compare: としょかん に いきます (go TO the library) vs としょかん で よみます (read AT the library).'},
  {h:'で: by what means',p:['<b>で</b> also marks how you do something: the tool, the vehicle or the language.'],ex:[['バス で いきます。','I go by bus.'],['にほんご で はなします。','I speak in Japanese.']],tip:'"On foot" is あるいて, with no で.'},
  {h:'と: together with',p:['<b>と</b> means "with" a person. To say "alone", use ひとり で.'],ex:[['ともだち と えいが を みます。','I watch a movie with a friend.'],['ひとり で たべます。','I eat alone.']]}],
 qs:[{t:'fill',jp:'しちじ ＿ おきます。',en:'I get up at 7 o\'clock.',o:['に','で','を','と'],why:'Clock times take に.'},
  {t:'fill',jp:'としょかん ＿ べんきょう します。',en:'I study at the library.',o:['で','に','を','と'],why:'The place where an action happens takes で.'},
  {t:'fill',jp:'でんしゃ ＿ がっこう に いきます。',en:'I go to school by train.',o:['で','に','と','を'],why:'The means of transport takes で.'},
  {t:'fill',jp:'ともだち ＿ レストラン に いきます。',en:'I go to a restaurant with a friend.',o:['と','で','を','は'],why:'と = together with.'},
  {t:'mc',q:'Which particle can replace に in がっこう に いきます?',o:['へ','で','を','と'],why:'へ (read "e") also marks a destination.'},
  {t:'mc',q:'あした ＿ がっこう に いきます。 What goes in the gap?',o:['Nothing (no particle)','に','で','を'],why:'Relative time words like あした take no particle.'},
  {t:'build',en:'I go home by bus.',tiles:['バス','で','うち','に','かえります'],x:['を','と'],why:'バス で (by bus), うち に (to home).'},
  {t:'mc',q:'What does this mean?',jp:'ひとり で えいが を みます。',o:['I watch a movie alone.','I watch one movie.','I watch a movie with one friend.','A person watches a movie.'],why:'ひとり で = alone.'},
  {t:'type',q:'Write in Japanese: "I go to the library."',a:['としょかん に いきます','としょかん へ いきます'],why:'に or へ both work here.'},
  {t:'mc',q:'How do you say "I walk to the station"?',o:['あるいて えき に いきます。','あるいて で えき に いきます。','えき で あるいて いきます。','えき を あるいて いきます。'],why:'あるいて needs no で, and えき に marks the destination.'}]},
{id:'v3',st:'s4',t:'The past: ました and ませんでした',sub:'きのう すし を たべました',g:'た',kind:'gram',drill:{t:'past',L:VB},
 words:W([['きのう','yesterday'],['あした','tomorrow'],['けさ','this morning'],['こんばん','tonight'],['ゆうべ','last night'],['せんしゅう','last week'],['らいしゅう','next week'],['まいあさ','every morning']]),
 intro:[{h:'Past: ～ました',p:['Change ます to <b>ました</b> for the past tense.'],ex:[['きのう すし を たべました。','I ate sushi yesterday.']]},
  {h:'Past negative: ～ませんでした',p:['Add <b>でした</b> to ません: ませんでした means "did not".'],ex:[['けさ コーヒー を のみませんでした。','I didn\'t drink coffee this morning.']]},
  {h:'Four forms, one pattern',p:['Every polite verb follows the same four forms. Learn them once and they work everywhere.'],tbl:[['たべます','present / future','eat, will eat'],['たべません','negative','don\'t eat'],['たべました','past','ate'],['たべませんでした','past negative','didn\'t eat']]},
  {h:'Time words',ex:[['きのう','yesterday'],['けさ','this morning'],['ゆうべ','last night'],['こんばん','tonight'],['せんしゅう','last week'],['らいしゅう','next week']],p:['Like あした, these relative time words take no particle.']}],
 qs:[{t:'mc',q:'What does this mean?',jp:'きのう ほん を よみました。',o:['I read a book yesterday.','I will read a book tomorrow.','I didn\'t read a book yesterday.','I read books every day.'],why:'よみました = read (past).'},
  {t:'fill',jp:'ゆうべ テレビ を ＿。',en:'I didn\'t watch TV last night.',o:['みませんでした','みました','みません','みます'],why:'Past negative = ませんでした.'},
  {t:'mc',q:'Which is the past of ききます (listen)?',o:['ききました','ききません','ききませんでした','きました'],why:'きました is the past of きます (come). Watch the extra き.'},
  {t:'build',en:'I went to Tokyo last week.',tiles:['せんしゅう','とうきょう','に','いきました'],x:['で','いきます'],why:'せんしゅう (last week) + past tense.'},
  {t:'mc',q:'Someone asks けさ たべました か。 You skipped breakfast. What do you answer?',o:['いいえ、たべませんでした。','いいえ、たべません。','はい、たべませんでした。','たべます か。'],why:'Answer in the past negative.'},
  {t:'type',q:'Write in Japanese: "I got up at 6 o\'clock."',a:['ろくじ に おきました'],why:'ろくじ に (at 6) おきました (got up).'},
  {t:'fill',jp:'らいしゅう ともだち と えいが を ＿。',en:'I will watch a movie with a friend next week.',o:['みます','みました','みませんでした','みません'],why:'らいしゅう is the future, so use ます.'},
  {t:'mc',q:'What does ゆうべ mean?',o:['last night','tonight','this morning','tomorrow'],why:'ゆうべ = last night; こんばん = tonight.'}]},
{id:'v4',st:'s4',t:'い-adjectives',sub:'おおきい · おおきくない · おおきかった',g:'い',kind:'gram',drill:{t:'iadj',L:IA},
 words:W(IA),
 intro:[{h:'Adjectives that end in い',p:['These adjectives end in い. Put them straight before a noun, or at the end of a sentence followed by です.'],ex:[['おおきい くるま','a big car'],['この くるま は おおきい です。','This car is big.']]},
  {h:'Negative: い → くない',p:['Drop the final い and add <b>くない</b>.'],ex:[['たかくない です。','It isn\'t expensive.']],tip:'A very common mistake is たかい じゃ ありません. い-adjectives never take じゃ ありません.'},
  {h:'Past: い → かった',p:['Drop い and add <b>かった</b> for the past. For the past negative, add <b>くなかった</b>.'],tbl:[['おいしい です','present','is tasty'],['おいしくない です','negative','isn\'t tasty'],['おいしかった です','past','was tasty'],['おいしくなかった です','past negative','wasn\'t tasty']],tip:'Never say おいしい でした. The past lives inside the adjective: おいしかった です.'},
  {h:'The rebel: いい',p:['いい (good) borrows its forms from an older word, よい.'],tbl:[['いい です','present','is good'],['よくない です','negative','isn\'t good'],['よかった です','past','was good'],['よくなかった です','past negative','wasn\'t good']]}],
 qs:[{t:'mc',q:'Which is correct for "This book is interesting"?',o:['この ほん は おもしろい です。','この ほん は おもしろい だ です。','この ほん は おもしろ です。','この ほん は おもしろい な です。'],why:'い-adjective + です. No な, no だ.'},
  {t:'fill',jp:'きのう は ＿ です。',en:'It was cold yesterday.',o:['さむかった','さむい','さむくない','さむい でした'],why:'Past of さむい = さむかった. Never さむい でした.'},
  {t:'mc',q:'What is the negative of たかい です?',o:['たかくない です','たかい じゃ ありません','たかいない です','たかくなかった です'],why:'い → くない.'},
  {t:'mc',q:'What is the past of いい です?',o:['よかった です','いかった です','いい でした','よくない です'],why:'いい uses よ- forms: よかった.'},
  {t:'build',en:'It is a small car.',tiles:['ちいさい','くるま','です'],x:['な','の'],why:'い-adjectives go directly before the noun.'},
  {t:'mc',q:'What does this mean?',jp:'テスト は むずかしくなかった です。',o:['The test wasn\'t difficult.','The test was difficult.','The test isn\'t difficult.','Was the test difficult?'],why:'くなかった = past negative.'},
  {t:'type',q:'Write in Japanese: "It was delicious."',a:['おいしかった です'],why:'おいしい → おいしかった です.'},
  {t:'mc',q:'あつい です。 What is the most likely meaning?',o:['It\'s hot.','It\'s thick.','I\'m tired.','It\'s cheap.'],why:'あつい = hot (weather).'}]},
{id:'v5',st:'s4',t:'な-adjectives and すき',sub:'しずか な へや · すし が すき',g:'な',kind:'gram',drill:{t:'naadj',L:NA},
 words:W(NA),
 intro:[{h:'Adjectives that need な',p:['な-adjectives take <b>な</b> when they come before a noun. At the end of a sentence, just add です.'],ex:[['しずか な へや','a quiet room'],['へや は しずか です。','The room is quiet.']]},
  {h:'They change like nouns',p:['な-adjectives use the same endings as nouns.'],tbl:[['しずか です','present','is quiet'],['しずか じゃ ありません','negative','isn\'t quiet'],['しずか でした','past','was quiet'],['しずか じゃ ありませんでした','past negative','wasn\'t quiet']]},
  {h:'Watch out for きれい',p:['きれい and ゆうめい end in い but are な-adjectives. Their negative is きれい じゃ ありません, never きれくない.'],ex:[['きれい な はな','a pretty flower']]},
  {h:'すき, きらい, じょうず take が',p:['To say you like something, mark the thing with <b>が</b>, not を.'],ex:[['わたし は ねこ が すき です。','I like cats.'],['テニス が へた です。','I\'m bad at tennis.']]}],
 qs:[{t:'fill',jp:'とうきょう は ＿ な まち です。',en:'Tokyo is a lively city.',o:['にぎやか','にぎやかい','にぎやかく','にぎやかの'],why:'The adjective is にぎやか; な links it to まち.'},
  {t:'mc',q:'What is the negative of きれい です?',o:['きれい じゃ ありません','きれくない です','きれいくない です','きれい ない です'],why:'きれい is a な-adjective despite the final い.'},
  {t:'fill',jp:'わたし は ねこ ＿ すき です。',en:'I like cats.',o:['が','を','に','で'],why:'すき takes が.'},
  {t:'mc',q:'What is the past of ひま です?',o:['ひま でした','ひまかった です','ひまい でした','ひま じゃ ありません'],why:'な-adjectives use でした.'},
  {t:'build',en:'It is a quiet room.',tiles:['しずか','な','へや','です'],x:['い','の'],why:'な-adjective + な + noun.'},
  {t:'mc',q:'What does this mean?',jp:'きのう は げんき じゃ ありませんでした。',o:['I wasn\'t well yesterday.','I was well yesterday.','I\'m not well today.','Were you well yesterday?'],why:'じゃ ありませんでした = past negative.'},
  {t:'type',q:'Write in Japanese: "I like sushi."',a:['すし が すき です','わたし は すし が すき です'],why:'すし が すき です.'},
  {t:'mc',q:'Which word is a な-adjective even though it ends in い?',o:['きれい','おおきい','たかい','おいしい'],why:'きれい → きれい な, きれい じゃ ありません.'}]},
{id:'v6',st:'s4',t:'There is: あります and います',sub:'つくえ の うえ に ほん が あります',g:'あ',kind:'gram',
 words:W([['あります','there is (things)'],['います','there is (people, animals)'],['した','below, under'],['まえ','in front'],['うしろ','behind'],['となり','next to'],['なか','inside'],['つくえ','desk'],['いす','chair'],['ここ','here'],['そこ','there (near you)'],['あそこ','over there']]),
 intro:[{h:'Two verbs for "there is"',p:['Use <b>あります</b> for things and plants. Use <b>います</b> for people and animals: anything that moves on its own.'],ex:[['ほん が あります。','There is a book.'],['ねこ が います。','There is a cat.']]},
  {h:'Place に, thing が あります',p:['To say what is somewhere, mark the place with に and the thing with が.'],ex:[['つくえ の うえ に ほん が あります。','There is a book on the desk.']]},
  {h:'Thing は place に あります',p:['To say where a known thing is, make it the topic with は.'],ex:[['ほん は つくえ の うえ に あります。','The book is on the desk.']]},
  {h:'Position words',p:['Use X の + position: "the top of X", "the inside of X".'],tbl:[['うえ','on, above',''],['した','under, below',''],['なか','inside',''],['まえ','in front of',''],['うしろ','behind',''],['となり','next to','']]},
  {h:'ここ, そこ, あそこ',p:['The same ko-so-a-do system from これ/それ/あれ, now for places.'],tbl:[['ここ','here','near me'],['そこ','there','near you'],['あそこ','over there','far from both'],['どこ','where?','']]}],
 qs:[{t:'fill',jp:'へや に ねこ が ＿。',en:'There is a cat in the room.',o:['います','あります','です','いきます'],why:'Animals take います.'},
  {t:'fill',jp:'つくえ の うえ に ほん が ＿。',en:'There is a book on the desk.',o:['あります','います','です','します'],why:'Objects take あります.'},
  {t:'fill',jp:'いす は つくえ の ＿ に あります。',en:'The chair is in front of the desk.',o:['まえ','うしろ','うえ','なか'],why:'まえ = in front.'},
  {t:'mc',q:'What does this mean?',jp:'えき の となり に レストラン が あります。',o:['There is a restaurant next to the station.','The station is next to the restaurant.','There is a station inside the restaurant.','I go to the restaurant by the station.'],why:'えき の となり = next to the station.'},
  {t:'build',en:'The dog is under the desk.',tiles:['いぬ','は','つくえ','の','した','に','います'],x:['あります','を'],why:'Dogs are alive, so います.'},
  {t:'mc',q:'What does あそこ mean?',o:['over there','here','there (near you)','where?'],why:'あそこ = far from both people.'},
  {t:'type',q:'Write in Japanese: "There is a teacher."',a:['せんせい が います'],why:'People take います.'},
  {t:'mc',q:'Which sentence is correct?',o:['かばん の なか に ほん が あります。','かばん の なか に ほん が います。','かばん に なか の ほん が あります。','ほん が かばん を なか あります。'],why:'Place に, thing が, あります for objects.'}]},
{id:'v7',st:'s4',t:'Verb groups and the dictionary form',sub:'たべる → たべます · のむ → のみます',g:'る',kind:'gram',drill:{t:'dict',L:VB},
 words:W([['たべる','to eat'],['のむ','to drink'],['いく','to go'],['くる','to come'],['する','to do'],['かえる','to go home'],['みる','to see'],['まつ','to wait'],['あそぶ','to play'],['およぐ','to swim']]),
 intro:[{h:'The dictionary form',p:['Every verb has a plain form, the one you\'ll find in a dictionary: たべる, のむ, いく. Friends use it in casual speech, and many grammar patterns are built on it.','Every dictionary form ends in an u-sound: る, む, く, う, つ, す, ぶ, ぐ.']},
  {h:'Group 2: る-verbs',p:['Drop the る and add ます. Most of these end in -iru or -eru.'],tbl:[['たべる','→ たべます','eat'],['みる','→ みます','see'],['ねる','→ ねます','sleep']]},
  {h:'Group 1: う-verbs',p:['Change the final u-sound to its i-sound, then add ます.'],tbl:[['のむ','→ のみます','む → み'],['かく','→ かきます','く → き'],['まつ','→ まちます','つ → ち'],['かう','→ かいます','う → い'],['はなす','→ はなします','す → し']]},
  {h:'Group 3: two irregulars',p:['Only two verbs break the rules, and they\'re very common.'],tbl:[['する','→ します','do'],['くる','→ きます','come']]},
  {h:'Group 1 in disguise',p:['A few verbs end in -eru or -iru but are Group 1. They have to be memorised.'],tbl:[['かえる','→ かえります','go home'],['はいる','→ はいります','enter'],['しる','→ しります','know']],tip:'If you\'re unsure of a verb\'s group, the ます-form tells you: かえります with り means Group 1.'}],
 qs:[{t:'mc',q:'Which group is たべる?',o:['Group 2 (る-verb)','Group 1 (う-verb)','Group 3 (irregular)','It is not a verb'],why:'たべる → たべます: drop る.'},
  {t:'mc',q:'Which group is かえる (to go home)?',o:['Group 1 (う-verb)','Group 2 (る-verb)','Group 3 (irregular)','It is an adjective'],why:'かえる → かえります. It looks like Group 2 but isn\'t.'},
  {t:'mc',q:'What is the dictionary form of きます (come)?',o:['くる','きる','きく','きむ'],why:'くる is irregular: くる → きます.'},
  {t:'mc',q:'Which verb is irregular?',o:['する','みる','のむ','かく'],why:'する and くる are the two irregular verbs.'},
  {t:'mc',q:'What is the ます-form of まつ (wait)?',o:['まちます','まつます','まります','まてます'],why:'つ → ち + ます.'},
  {t:'mc',q:'Where would you look up たべます in a dictionary?',o:['たべる','たべ','たべます','たべう'],why:'Dictionaries list the dictionary form.'}]},
{id:'v8',st:'s4',t:'The て-form',sub:'まって ください · みて います',g:'て',kind:'gram',drill:{t:'te',L:VB},
 words:W([['まって ください','please wait'],['みて ください','please look'],['きいて ください','please listen'],['ゆっくり','slowly'],['もう いちど','once more'],['いま','now']]),
 intro:[{h:'Why the て-form matters',p:['The て-form links actions, makes polite requests (～て ください) and describes what is happening right now (～て います). You\'ll use it constantly.']},
  {h:'Group 2 and the irregulars',p:['Group 2 is easy: replace る with て. The irregulars are する → して and くる → きて.'],tbl:[['たべる','→ たべて',''],['みる','→ みて',''],['する','→ して',''],['くる','→ きて','']]},
  {h:'Group 1: it depends on the ending',p:['Group 1 verbs change according to their last kana.'],tbl:[['う つ る','→ って','かう→かって, まつ→まって'],['む ぶ ぬ','→ んで','のむ→のんで, あそぶ→あそんで'],['く','→ いて','かく→かいて'],['ぐ','→ いで','およぐ→およいで'],['す','→ して','はなす→はなして']],tip:'One exception: いく → いって (not いいて).'},

 qs:[{t:'mc',q:'How do you say "Tokyo is bigger than Osaka"?',o:['とうきょう は おおさか より おおきい です。','おおさか は とうきょう より おおきい です。','とうきょう より おおさか は おおきい です。','とうきょう は おおさか ほど おおきい です。'],why:'The thing compared against goes before より.'},
  {t:'fill',jp:'いぬ と ねこ と ＿ が すき です か。',en:'Which do you like better, dogs or cats?',o:['どちら','どれ','なに','どこ'],why:'どちら = which of two.'},
  {t:'mc',q:'You prefer cats. How do you answer?',o:['ねこ の ほう が すき です。','ねこ より すき です。','ねこ ほど すき です。','ねこ が どちら すき です。'],why:'A の ほう が = A is more.'},
  {t:'fill',jp:'くだもの の なか で りんご が ＿ すき です。',en:'Of all fruit, I like apples the most.',o:['いちばん','より','ほう','どちら'],why:'いちばん = the most.'},
  {t:'mc',q:'What does this mean?',jp:'きょう は きのう ほど さむくない です。',o:['Today isn\'t as cold as yesterday.','Today is colder than yesterday.','Yesterday wasn\'t as cold as today.','Both days were cold.'],why:'ほど ～ない = not as… as.'},
  {t:'build',en:'The train is faster than the bus.',tiles:['でんしゃ','は','バス','より','はやい','です'],x:['ほう','いちばん'],why:'A は B より ～.'},
  {t:'mc',q:'Ask "Which is the most expensive?" about three items.',o:['どれ が いちばん たかい です か。','どちら が いちばん たかい です か。','どれ が たかい ほう です か。','なに が より たかい です か。'],why:'Three or more items: どれ + いちばん.'},
  {t:'type',q:'Write in Japanese: "Coffee is better." (comparing with tea)',a:['コーヒー の ほう が いい です'],why:'コーヒー の ほう が いい です.'}]},
{id:'n6',st:'s6',t:'Can do: the potential form',sub:'よめる · たべられる · できる',g:'能',kind:'gram',drill:{t:'conj',f:['pot'],L:VB},
 words:W([['できる','can do'],['うんてん','driving'],['およぐ','swim'],['かんじ','kanji'],['ピアノ','piano'],['ひく','play (strings, piano)']]),
 intro:[{h:'Making the potential form',p:['<b>Group 1:</b> u-sound → e-sound + る: よむ → よめる, はなす → はなせる.','<b>Group 2:</b> drop る + られる: たべる → たべられる. (In casual speech you\'ll hear たべれる.)','<b>Group 3:</b> する → できる, くる → こられる.'],tip:'The potential form is itself a Group 2 verb: よめる → よめます, よめない, よめた.'},
  {h:'が marks what you can do',p:['The thing you can do usually takes <b>が</b> instead of を.'],ex:[['にほんご が はなせます。','I can speak Japanese.'],['かんじ が よめません。','I can\'t read kanji.']]},
  {h:'～ことが できる',p:['A more formal option: dictionary form + <b>こと が できます</b>.'],ex:[['にほんご を はなす こと が できます。','I can speak Japanese.']]}],
 qs:[{t:'mc',q:'What is the potential form of よむ?',o:['よめる','よまれる','よみれる','よむれる'],why:'む → め + る. よまれる is the passive.'},
  {t:'mc',q:'What is the potential form of たべる?',o:['たべられる','たべける','たべめる','たべさせる'],why:'Group 2: る → られる.'},
  {t:'mc',q:'How do you say "I can speak Japanese"?',o:['にほんご が はなせます。','にほんご を はなします。','にほんご が はなされます。','にほんご が はなしたい です。'],why:'はなす → はなせる → はなせます.'},
  {t:'mc',q:'What is the potential form of する?',o:['できる','しれる','される','せる'],why:'する → できる.'},
  {t:'fill',jp:'かんじ が ＿ か。',en:'Can you read kanji?',o:['よめます','よみます','よまれます','よまれません'],why:'Potential of よむ: よめます.'},
  {t:'mc',q:'What does あした こられます か mean?',o:['Can you come tomorrow?','Will you be told tomorrow?','Did you come yesterday?','Please come tomorrow.'],why:'くる → こられる (can come).'},
  {t:'build',en:'I can\'t swim.',tiles:['わたし','は','およげません'],x:['およぎます','を'],why:'およぐ → およげる → およげません.'},
  {t:'type',q:'Write in Japanese: "I can swim."',a:['およげます','わたし は およげます'],why:'およぐ → およげます.'},
  {t:'mc',q:'Which means the same as にほんご が はなせます?',o:['にほんご を はなす こと が できます。','にほんご を はなして います。','にほんご が すき です。','にほんご を はなしましょう。'],why:'～ことが できる = can do.'}]},
{id:'n7',st:'s6',t:'Experiences, lists, "when"',sub:'～た ことが ある · ～たり · ～とき',g:'時',kind:'gram',drill:{t:'conj',f:['ta'],L:VB},
 words:W([['こと','thing, experience'],['そうじ','cleaning'],['かいもの','shopping'],['よく','often'],['ふじさん','Mt. Fuji'],['ちゅうごく','China'],['やすみ の ひ','day off']]),
 intro:[{h:'Experience: ～た ことが ある',p:['た-form + <b>こと が あります</b> = have done before. Negative: こと が ありません (have never).'],ex:[['にほん に いった こと が あります。','I have been to Japan.'],['すし を たべた こと が ありません。','I have never eaten sushi.']]},
  {h:'Examples: ～たり ～たり する',p:['た-form + り, twice, then する: doing things like A and B (among others).'],ex:[['やすみ の ひ は そうじ を したり かいもの を したり します。','On days off I do things like cleaning and shopping.']]},
  {h:'When: ～とき',p:['Plain form, い-adjective, な-adjective + な, or noun + の, then <b>とき</b>.'],ex:[['こども の とき、 よく あそびました。','When I was a child, I often played.'],['さむい とき、 おちゃ を のみます。','When it\'s cold, I drink tea.'],['ひま な とき、 ほん を よみます。','When I\'m free, I read books.']]}],
 qs:[{t:'mc',q:'How do you say "I have been to Japan"?',o:['にほん に いった こと が あります。','にほん に いく こと が あります。','にほん に いって こと が あります。','にほん に いきました こと が あります。'],why:'た-form + こと が あります.'},
  {t:'mc',q:'What does this mean?',jp:'すし を たべた こと が ありません。',o:['I have never eaten sushi.','I can\'t eat sushi.','I don\'t eat sushi.','I didn\'t eat sushi today.'],why:'～た こと が ない = have never.'},
  {t:'fill',jp:'やすみ の ひ は そうじ を ＿ かいもの を したり します。',en:'On days off I do things like cleaning and shopping.',o:['したり','して','した','する'],why:'～たり ～たり する.'},
  {t:'fill',jp:'こども の ＿、 よく あそびました。',en:'When I was a child, I often played.',o:['とき','まえ','あと','から'],why:'noun + の とき = when.'},
  {t:'mc',q:'How do you say "When it\'s cold, I drink tea"?',o:['さむい とき、 おちゃ を のみます。','さむい の とき、 おちゃ を のみます。','さむい な とき、 おちゃ を のみます。','さむく とき、 おちゃ を のみます。'],why:'い-adjectives go straight before とき.'},
  {t:'mc',q:'What does ひま な とき mean?',o:['when I\'m free','when it\'s quiet','when I\'m busy','after I\'m free'],why:'ひま = free time.'},
  {t:'build',en:'Have you ever seen Mt. Fuji?',tiles:['ふじさん','を','みた','こと','が','あります','か'],x:['みる','います'],why:'た-form + こと が あります か.'},
  {t:'type',q:'Write in Japanese: "I have never been to China."',a:['ちゅうごく に いった こと が ありません'],why:'いった こと が ありません.'},
  {t:'mc',q:'Which sentence is correct?',o:['えいが を みたり、 ほん を よんだり します。','えいが を みたり、 ほん を よむ します。','えいが を みて、 ほん を よんだり。','えいが を みたり、 ほん を よんだり。 '],why:'Both verbs take ～たり, and the pattern ends with する.'}]},
{id:'n8',st:'s6',t:'Giving and receiving',sub:'あげる · くれる · もらう',g:'贈',kind:'gram',
 words:W([['あげる','give (to others)'],['くれる','give (to me)'],['もらう','receive'],['てつだう','help'],['ひっこし','moving house'],['ケーキ','cake'],['とけい','watch']]),
 intro:[{h:'Three verbs, three directions',tbl:[['あげる','I / someone gives → someone else','away from me'],['くれる','someone gives → me (or my group)','towards me'],['もらう','I receive from someone','giver takes に or から']],ex:[['わたし は ともだち に ほん を あげました。','I gave my friend a book.'],['ともだち が わたし に はな を くれました。','My friend gave me flowers.'],['ちち に とけい を もらいました。','I received a watch from my father.']]},
  {h:'Doing favours: ～て あげる / くれる / もらう',p:['Attach these to the て-form to show who did a favour for whom.'],ex:[['いもうと に えいご を おしえて あげました。','I taught my little sister English (for her).'],['せんせい が しゅくだい を てつだって くれました。','The teacher kindly helped me with my homework.'],['ともだち に ひっこし を てつだって もらいました。','I got my friend to help me move.']],tip:'くれる always points towards the speaker. "わたし は ～ に くれました" is never correct.'}],
 qs:[{t:'fill',jp:'わたし は ともだち に ほん を ＿。',en:'I gave my friend a book.',o:['あげました','くれました','もらいました','かいました'],why:'From me to others: あげる.'},
  {t:'fill',jp:'ともだち が わたし に はな を ＿。',en:'My friend gave me flowers.',o:['くれました','あげました','もらいました','かいました'],why:'Towards me: くれる.'},
  {t:'mc',q:'How do you say "I received a watch from my father"?',o:['ちち に とけい を もらいました。','ちち が とけい を もらいました。','ちち に とけい を くれました。','ちち を とけい に もらいました。'],why:'Receiver は/が, giver に, もらう.'},
  {t:'mc',q:'What does this mean?',jp:'せんせい が しゅくだい を てつだって くれました。',o:['The teacher kindly helped me with my homework.','I helped the teacher with homework.','I asked the teacher for homework.','The teacher gave me homework.'],why:'～て くれる = someone does a favour for me.'},
  {t:'fill',jp:'いもうと に えいご を おしえて ＿。',en:'I taught my little sister English (as a favour).',o:['あげました','くれました','もらいました','ください'],why:'A favour from me to others: ～て あげる.'},
  {t:'mc',q:'ともだち に ひっこし を てつだって もらいました。 Who received the help?',o:['I did','My friend did','Both of us','Nobody'],why:'～て もらう: I receive the favour.'},
  {t:'build',en:'My mother made me a cake.',tiles:['はは','が','ケーキ','を','つくって','くれました'],x:['あげました','に'],why:'A favour towards me: ～て くれる.'},
  {t:'mc',q:'Which sentence is incorrect?',o:['わたし は ともだち に ほん を くれました。','ともだち が わたし に ほん を くれました。','わたし は ともだち に ほん を あげました。','わたし は ともだち に ほん を もらいました。'],why:'くれる can\'t go from me to others.'}]},
{id:'n9',st:'s6',t:'Thinking, saying, maybe',sub:'～と おもう · ～と いう · でしょう · かもしれない',g:'思',kind:'gram',
 words:W([['おもう','think'],['いう','say'],['たぶん','probably'],['ふる','fall (rain, snow)'],['はれる','be sunny'],['かもしれません','might']]),
 intro:[{h:'～と おもいます: I think',p:['Plain form + <b>と おもいます</b>. Nouns and な-adjectives need だ before と.'],ex:[['あした は あめ が ふる と おもいます。','I think it will rain tomorrow.'],['しずか だ と おもいます。','I think it\'s quiet.']]},
  {h:'～と いいました: said',p:['Quote with <b>と</b>, either in 「」 brackets or in plain form.'],ex:[['ケンさん は 「いきます」 と いいました。','Ken said, "I\'ll go."'],['たなかさん は あした こない と いいました。','Tanaka said he won\'t come tomorrow.']]},
  {h:'Probably and might',p:['<b>でしょう</b> = probably (often with たぶん). <b>かもしれません</b> = might. Both attach to the plain form, and nouns/な-adjectives drop だ.'],ex:[['あした は たぶん はれる でしょう。','It will probably be sunny tomorrow.'],['あの ひと は せんせい かもしれません。','That person might be a teacher.']]}],
 qs:[{t:'mc',q:'How do you say "I think it will rain tomorrow"?',o:['あした は あめ が ふる と おもいます。','あした は あめ が ふります と おもいます。','あした は あめ が ふる と いいます。','あした は あめ が ふる でしょう と。'],why:'Plain form + と おもいます.'},
  {t:'fill',jp:'たなかさん は あした こない ＿ いいました。',en:'Tanaka said he won\'t come tomorrow.',o:['と','を','が','に'],why:'Quotes take と.'},
  {t:'mc',q:'What does this mean?',jp:'あの ひと は せんせい かもしれません。',o:['That person might be a teacher.','That person is definitely a teacher.','That person isn\'t a teacher.','That person used to be a teacher.'],why:'かもしれません = might.'},
  {t:'mc',q:'How do you say "I think it\'s quiet"?',o:['しずか だ と おもいます。','しずか と おもいます。','しずか な と おもいます。','しずかい と おもいます。'],why:'な-adjectives need だ before と おもう.'},
  {t:'fill',jp:'あした は たぶん はれる ＿。',en:'It will probably be sunny tomorrow.',o:['でしょう','ましょう','たい','ください'],why:'でしょう = probably.'},
  {t:'build',en:'I think this movie is interesting.',tiles:['この','えいが','は','おもしろい','と','おもいます'],x:['だ','です'],why:'い-adjectives need no だ.'},
  {t:'type',q:'Write in Japanese: "It might rain."',a:['あめ が ふる かもしれません'],why:'ふる + かもしれません.'},
  {t:'mc',q:'Which sentence reports what Ken said?',o:['ケンさん は 「いきます」 と いいました。','ケンさん は 「いきます」 を いいました。','ケンさん は 「いきます」 に いいました。','ケンさん は 「いきます」 が いいました。'],why:'Quotes take と.'}]},
{id:'n10',st:'s6',t:'If and when: conditionals',sub:'～たら · ～ば · ～と',g:'ば',kind:'gram',drill:{t:'conj',f:['ba','tara'],L:VB},
 words:W([['もし','if (emphasis)'],['ボタン','button'],['おす','press, push'],['ドア','door'],['あく','open (by itself)'],['さく','bloom'],['じかん','time']]),
 intro:[{h:'～たら: if / when (the all-rounder)',p:['た-form + <b>ら</b>. Works for one-off conditions and for "when (this happens)".'],ex:[['あめ が ふったら、 いきません。','If it rains, I won\'t go.'],['うち に かえったら、 でんわ します。','When I get home, I\'ll call.']]},
  {h:'～ば: if',p:['<b>Group 1:</b> u-sound → e-sound + ば: いく → いけば.','<b>Group 2:</b> drop る + れば: たべる → たべれば.','<b>Group 3:</b> すれば, くれば. <b>い-adj:</b> い → ければ (いい → よければ).'],ex:[['じかん が あれば、 きて ください。','If you have time, please come.']]},
  {h:'～と: whenever, automatically',p:['Plain present + <b>と</b> for natural, automatic results. It can\'t be followed by requests, invitations or plans.'],ex:[['この ボタン を おす と、 ドア が あきます。','When you press this button, the door opens.'],['はる に なる と、 さくら が さきます。','When spring comes, the cherry blossoms bloom.']]}],
 qs:[{t:'mc',q:'What is the ば-form of いく?',o:['いけば','いきば','いかば','いくば'],why:'く → け + ば.'},
  {t:'mc',q:'How do you say "If it rains, I won\'t go"?',o:['あめ が ふったら、 いきません。','あめ が ふるたら、 いきません。','あめ が ふって たら、 いきません。','あめ が ふりたら、 いきません。'],why:'た-form ふった + ら.'},
  {t:'fill',jp:'この ボタン を おす ＿、 ドア が あきます。',en:'When you press this button, the door opens.',o:['と','たら','ば','から'],why:'Automatic result: plain form + と.'},
  {t:'mc',q:'What is the ば-form of たべる?',o:['たべれば','たべば','たべられば','たべるば'],why:'Group 2: る → れば.'},
  {t:'mc',q:'What does this mean?',jp:'うち に かえったら、 でんわ します。',o:['When I get home, I\'ll call.','Because I went home, I called.','If I go home, I won\'t call.','I called when I was at home.'],why:'～たら = when (it happens).'},
  {t:'mc',q:'What is the ば-form of いい?',o:['よければ','いければ','いいば','いいれば'],why:'いい uses よ-: よければ.'},
  {t:'build',en:'If you have time, please come.',tiles:['じかん','が','あれば','きて','ください'],x:['から','ある'],why:'ある → あれば.'},
  {t:'type',q:'Write in Japanese: "If it\'s cheap, I\'ll buy it."',a:['やすかったら かいます','やすければ かいます'],why:'やすい → やすかったら / やすければ.'},
  {t:'mc',q:'Which ～と sentence is correct?',o:['はる に なる と、 さくら が さきます。','はる に なる と、 さくら を みましょう。','はる に なる と、 きて ください。','はる に なった と、 さくら が さきます。'],why:'～と can\'t be followed by an invitation or request.'}]},
{id:'n11',st:'s6',t:'Passive and causative',sub:'～られる · ～させる',g:'受',kind:'gram',drill:{t:'conj',f:['pass','caus'],L:VB},
 words:W([['しかる','scold'],['ほめる','praise'],['かむ','bite'],['ぬすむ','steal'],['さいふ','wallet'],['やさい','vegetables']]),
 intro:[{h:'The passive: was done to',p:['<b>Group 1:</b> u-sound → a-sound + れる: よむ → よまれる, いう → いわれる.','<b>Group 2:</b> drop る + られる: たべる → たべられる.','<b>Group 3:</b> する → される, くる → こられる.','The person who did it takes <b>に</b>.'],ex:[['せんせい に ほめられました。','I was praised by the teacher.'],['いぬ に かまれました。','I was bitten by a dog.']]},
  {h:'Suffering passive',p:['Japanese also uses the passive when something annoying happens to you.'],ex:[['さいふ を ぬすまれました。','My wallet was stolen.'],['あめ に ふられました。','I got caught in the rain.']]},
  {h:'The causative: make / let',p:['<b>Group 1:</b> u-sound → a-sound + せる: いく → いかせる.','<b>Group 2:</b> drop る + させる: たべる → たべさせる.','<b>Group 3:</b> する → させる, くる → こさせる.'],ex:[['はは は わたし に やさい を たべさせました。','My mother made me eat vegetables.'],['きょう は はやく かえらせて ください。','Please let me go home early today.']],tip:'～させて ください is a polite way to ask permission to do something yourself.'}],
 qs:[{t:'mc',q:'What is the passive form of しかる (scold)?',o:['しかられる','しかれる','しからせる','しかりれる'],why:'る → ら + れる.'},
  {t:'mc',q:'What does this mean?',jp:'せんせい に ほめられました。',o:['I was praised by the teacher.','I praised the teacher.','The teacher made me praise someone.','I can praise the teacher.'],why:'ほめる → ほめられる (passive); the doer takes に.'},
  {t:'fill',jp:'わたし は いぬ ＿ かまれました。',en:'I was bitten by a dog.',o:['に','を','が','で'],why:'In the passive, the doer takes に.'},
  {t:'mc',q:'What is the causative form of たべる?',o:['たべさせる','たべられる','たべせる','たべさる'],why:'Group 2: る → させる.'},
  {t:'mc',q:'What does this mean?',jp:'はは は わたし に やさい を たべさせました。',o:['My mother made me eat vegetables.','I fed my mother vegetables.','My mother ate vegetables for me.','I wanted to eat vegetables.'],why:'Causative: the person made to act takes に.'},
  {t:'mc',q:'How do you say "Please let me go home early today"?',o:['きょう は はやく かえらせて ください。','きょう は はやく かえって ください。','きょう は はやく かえられて ください。','きょう は はやく かえらないで ください。'],why:'かえる → かえらせる → かえらせて ください.'},
  {t:'mc',q:'What is the causative form of する?',o:['させる','しせる','される','できる'],why:'する → させる.'},

  else{ch=ch.slice(0,12);const a=ch.map(c=>qKana(c,pool,'k2r'));const b=shuffle(ch).map(c=>qKana(c,pool,rnd(['r2k','listen','type'])));qs=[...a,...wr.slice(0,3).map(c=>qWrite(c,'c:'+c,true)),...b,...shuffle(u.words).slice(0,4).map(w=>qWord(w,rnd(['read','mean'])))]}}
 else if(u.kind==='exam'){const all=u.from.flatMap(id=>UI[id].chars);const pool=all;qs=shuffle(all).slice(0,24).map(c=>qKana(c,pool,rnd(['k2r','r2k','listen','type'])));
  const ws=u.from.flatMap(id=>UI[id].words);qs.push(...shuffle(ws).slice(0,6).map(w=>qWord(w,rnd(['read','mean','listen']))));qs.push(...shuffle(all.filter(c=>STK[c])).slice(0,3).map(c=>qWrite(c,'c:'+c,false)));qs=shuffle(qs)}
 else if(u.kind==='gram'){const qa=u.qs.map((q,i)=>qAuth(q,'q:'+u.id+':'+i));const ws=shuffle(u.words);const dr=u.drill?shuffle(u.drill.L.map((_,j)=>j)).slice(0,T?6:8).map(j=>qDrill(u,j,'dr:'+u.id+':'+j)):[];

  const dr=shuffle(us.filter(x=>x.drill).flatMap(x=>x.drill.L.map((_,j)=>[x,j]))).slice(0,8).map(([x,j])=>qDrill(x,j,'dr:'+x.id+':'+j));qs=shuffle([...qa,...dr])}

  else{qs=[...ks.map(k=>qKanji(k,pool,'k2m')),...shuffle(u.ks).slice(0,5).map(k=>qWrite(k.c,'k:'+k.c,true)),...shuffle(u.ks).map(k=>qKanji(k,pool,rnd(['read','m2k','listen','wmean'])))]}}
