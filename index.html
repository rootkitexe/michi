/* ===== DRILLS ===== */
const FN={pos:'present',neg:'negative',past:'past',pneg:'past negative'};
const vForms=v=>({pos:v[1]+'ます',neg:v[1]+'ません',past:v[1]+'ました',pneg:v[1]+'ませんでした'});
const iForms=a=>{const b=a==='いい'?'よ':a.slice(0,-1);return{pos:a+' です',neg:b+'くない です',past:b+'かった です',pneg:b+'くなかった です'}};
const naForms=a=>({pos:a+' です',neg:a+' じゃ ありません',past:a+' でした',pneg:a+' じゃ ありませんでした'});
function teForm(v){const[d,,g]=v;if(d==='する')return'して';if(d==='くる')return'きて';if(d==='いく')return'いって';if(g===2)return d.slice(0,-1)+'て';
 return d.slice(0,-1)+({'う':'って','つ':'って','る':'って','む':'んで','ぶ':'んで','ぬ':'んで','く':'いて','ぐ':'いで','す':'して'})[d.slice(-1)]}
const uniq4=(a,fill)=>{const o=[];for(const x of a)if(x&&!o.includes(x))o.push(x);for(const x of shuffle(fill))if(o.length<4&&x&&!o.includes(x))o.push(x);return o.slice(0,4)};
function qDrill(u,j,id){if(DEDR[u.drill.t])return DEDR[u.drill.t](u,j,id);const D=u.drill,it=D.L[j];let label,big,a,opts,why;
 if(D.t==='masu'){const F=vForms(it);if(Math.random()<.5){label='Make it negative';big=F.pos;a=F.neg;opts=uniq4([F.neg,F.past,it[1]+'ないます',it[0]+'ません'],[]);why=`${F.pos} → <b>${F.neg}</b>: swap ます for ません.`}
  else{const neg=Math.random()<.5;label=`How do you say “I ${neg?'don\'t ':''}${it[3].split(',')[0]}”?`;a=neg?F.neg:F.pos;opts=uniq4([a,neg?F.pos:F.neg,F.past],D.L.filter(x=>x!==it).map(x=>neg?vForms(x).neg:vForms(x).pos));why=`${it[3]}: <b>${F.pos}</b> / ${F.neg}`}}
 else if(D.t==='past'){const F=vForms(it),k=rnd(['neg','past','pneg']);label=`Change to the ${FN[k]}`;big=F.pos;a=F[k];opts=shuffle([F.pos,F.neg,F.past,F.pneg]);why=`${F.pos} · ${F.neg} · ${F.past} · ${F.pneg}`}
 else if(D.t==='iadj'){const F=iForms(it[0]),k=rnd(['neg','past','pneg']);label=`Change to the ${FN[k]}`;big=F.pos;a=F[k];
  const trap=k==='neg'?it[0]+' じゃ ありません':k==='past'?it[0]+' でした':it[0]+' じゃ ありませんでした';opts=uniq4([a,trap,...shuffle(['neg','past','pneg'].filter(x=>x!==k).map(x=>F[x]))],[]);
  why=`${it[0]} (${it[1]}): ${F.neg} · ${F.past} · ${F.pneg}${it[0]==='いい'?'. いい uses よ- forms.':''}`}
 else if(D.t==='naadj'){const F=naForms(it[0]),k=rnd(['neg','past','pneg']);label=`Change to the ${FN[k]}`;big=F.pos;a=F[k];
  const stem=it[0];const trap=k==='neg'?stem+'くない です':k==='past'?stem+'かった です':stem+'くなかった です';opts=uniq4([a,trap,...shuffle(['neg','past','pneg'].filter(x=>x!==k).map(x=>F[x]))],[]);
  why=`${stem} (${it[1]}) is a な-adjective: ${F.neg} · ${F.past}`}
 else if(D.t==='dict'){const[d,st,g,en]=it,b=d.slice(0,-1);
  if(Math.random()<.5){label=`What is the ます-form of ${d} (${en})?`;a=st+'ます';opts=uniq4([a,d+'ます',g===2?b+'ります':b+'ます',g===1?st.slice(0,-1)+'ります':st+'います'],D.L.filter(x=>x!==it).map(x=>x[1]+'ます'));}
  else{label=`What is the dictionary form of ${st}ます?`;a=d;opts=uniq4([d,st+'る',st+'う',b+'る'],D.L.filter(x=>x!==it).map(x=>x[0]));}
  why=`${d} → ${st}ます (Group ${g}${g===3?', irregular':''}).`}
 else if(D.t==='conj')return qConj(u,j,id);
 else if(D.t==='te'){const t=teForm(it),b=it[0].slice(0,-1);label=`What is the て-form of ${it[0]} (${it[3].split(',')[0]})?`;a=t;
  opts=uniq4([t,it[1]+'て',...shuffle(['って','んで','いて','して'].map(e=>b+e))],[]);why=`${it[0]} → <b>${t}</b> (Group ${it[2]}).`}
 return{id,kind:'mc',label,big,bigW:1,bigS:1,bigRom:1,opts:shuffle(opts),a,optJP:1,optS:1,showRom:1,audio:a,why}}

/* ===== KANJI ===== */
function kanjiPool(uid){const out=[];for(const u of UNITS){if(u.kind==='kanji')out.push(...u.ks);if(u.id===uid)break}return out.length>=8?out:UNITS.filter(u=>u.kind==='kanji').flatMap(u=>u.ks)}
const kAllWords=()=>UNITS.filter(u=>u.kind==='kanji').flatMap(u=>u.ks.flatMap(k=>k.w));
function qKanji(k,pool,type,id){id=id||'k:'+k.c;const ex=rnd(k.w),others=shuffle(pool.filter(x=>x.c!==k.c));
 const why=`<b>${esc(k.c)}</b> = ${esc(k.m)} · On: ${esc(k.on||'none')} · Kun: ${esc(k.kun||'none')}<br>${esc(ex.w)} (${esc(ex.r)}) = ${esc(ex.e)}`;
 const ow=shuffle(kAllWords().filter(w=>!k.w.includes(w)));
 if(type==='k2m')return{id,kind:'mc',label:'What does this kanji mean?',big:k.c,opts:shuffle(uniq4([k.m,...others.map(x=>x.m)],[])),a:k.m,audio:ex.r,why};
 if(type==='m2k')return{id,kind:'mc',label:`Which kanji means “${k.m}”?`,opts:shuffle(uniq4([k.c,...others.map(x=>x.c)],[])),a:k.c,optJP:1,audio:ex.r,why};
 if(type==='read')return{id,kind:'mc',label:'How do you read this word?',big:ex.w,bigW:1,opts:shuffle(uniq4([ex.r,...ow.map(w=>w.r)],[])),a:ex.r,optJP:1,optS:1,audio:ex.r,why};
 if(type==='wmean')return{id,kind:'mc',label:'What does this word mean?',big:ex.w,bigW:1,opts:shuffle(uniq4([ex.e,...ow.map(w=>w.e)],[])),a:ex.e,audio:ex.r,why};
 if(type==='listen')return{id,kind:'mc',label:'Listen. Which word did you hear?',listen:ex.r,opts:shuffle(uniq4([ex.w,...ow.filter(w=>w.r!==ex.r).map(w=>w.w)],[])),a:ex.w,optJP:1,optS:1,audio:ex.r,why};
 if(type==='rtype')return{id,kind:'type',label:'Type the reading (romaji or kana)',big:ex.w,bigW:1,a:[ex.r],ar:[toRomaji(ex.r)],mode:'jp',audio:ex.r,why};
 return qWrite(k.c,id,type==='trace')}
function qWrite(ch,id,trace){const kj=KJI[ch],k=KD[ch];
 const label=kj?`Write the kanji for “${kj.m}”`:`Write “${k.r}” in ${k.s==='h'?'hiragana':'katakana'}`;
 const pr=kj?kj.m:k.r,pr2=kj?(kj.kun||kj.on):'';
 return{id,kind:'write',ch,trace:!!trace,label,pr,pr2,a:ch,audio:kj?kj.w[0].r:ch,why:kj?`<b>${esc(ch)}</b> = ${esc(kj.m)}. ${esc(kj.h)}`:`<b>${esc(ch)}</b> = ${esc(k.r)}. ${esc(mn(ch))}`}}
const allowMiss=ch=>Math.max(1,Math.floor((STK[ch]||[]).length/3));

/* ===== WRITING PAD ===== */
const NS='http://www.w3.org/2000/svg',NP=24,SAMP={},PADS={};let _mp=null,drawing=null;
function samp(ch){if(SAMP[ch])return SAMP[ch];
 try{if(!_mp){const s=document.createElementNS(NS,'svg');s.setAttribute('width','0');s.setAttribute('height','0');s.style.cssText='position:absolute;visibility:hidden;pointer-events:none';_mp=document.createElementNS(NS,'path');s.appendChild(_mp);document.body.appendChild(s)}
  return SAMP[ch]=(STK[ch]||[]).map(d=>{_mp.setAttribute('d',d);const L=_mp.getTotalLength(),pts=[];for(let i=0;i<NP;i++){const p=_mp.getPointAtLength(L*i/(NP-1));pts.push([p.x,p.y])}return{pts,L}})}catch(e){return SAMP[ch]=[]}}
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
function resamp(p,n){if(p.length<2)return Array(n).fill(p[0]||[0,0]);const c=[0];for(let i=1;i<p.length;i++)c.push(c[i-1]+dist(p[i],p[i-1]));const L=c[c.length-1]||1,o=[];let j=0;
 for(let i=0;i<n;i++){const t=L*i/(n-1);while(j<p.length-2&&c[j+1]<t)j++;const s=c[j+1]-c[j]||1,f=Math.min(1,Math.max(0,(t-c[j])/s));o.push([p[j][0]+(p[j+1][0]-p[j][0])*f,p[j][1]+(p[j+1][1]-p[j][1])*f])}return o}
function padHTML(id,ch,mode,opt={}){const st=STK[ch]||[];
 if(!st.length)return`<div class="sq"><span style="font-size:${ch.length>1?'110px':'170px'}">${esc(ch)}</span></div>`;
 PADS[id]={ch,mode,k:mode==='show'?st.length:0,miss:0,missK:0,done:mode==='show',onDone:opt.onDone,auto:opt.auto||mode==='show',anim:false};
 return`<svg class="pad" data-pad="${id}" viewBox="0 0 109 109" role="img" aria-label="Writing pad for ${esc(ch)}"><line class="gl" x1="54.5" y1="0" x2="54.5" y2="109"/><line class="gl" x1="0" y1="54.5" x2="109" y2="54.5"/><g class="gh">${mode==='trace'?st.map(d=>`<path d="${d}"/>`).join(''):''}</g><g class="dn"></g><g class="ht"></g><path class="ink" d=""/></svg>`}
const padEl=id=>document.querySelector(`svg[data-pad="${id}"]`);
function animInto(g,ch,from=0){const S2=samp(ch);let d=0;g.innerHTML=(STK[ch]||[]).slice(from).map((p,i)=>{const L=(S2[i+from]||{L:80}).L,t=.25+L/170;const h=`<path class="an" d="${p}" style="--l:${L+1};--t:${t}s;--d:${d}s"/>`;d+=t+.08;return h}).join('');return d}
function padWatch(id){const P=PADS[id],el=padEl(id);if(!P||!el)return;const g=el.querySelector('.dn');el.querySelector('.ht').innerHTML='';animInto(g,P.ch);if(P.mode!=='show'){P.anim=true;P.k=0;P.done=false}}
function padClear(id){const P=PADS[id],el=padEl(id);if(!P||!el||P.mode==='show')return;P.k=0;P.done=false;P.anim=false;P.missK=0;el.querySelector('.dn').innerHTML='';el.querySelector('.ht').innerHTML='';el.querySelector('.ink').setAttribute('d','')}
function padHint(id){const P=PADS[id],el=padEl(id);if(!P||!el||P.done)return;const d=(STK[P.ch]||[])[P.k];if(!d)return;const s=samp(P.ch)[P.k];const p0=s?s.pts[0]:[0,0];const L=s?s.L:80;
 el.querySelector('.ht').innerHTML=`<path class="an" d="${d}" style="--l:${L+1};--t:${.3+L/170}s;--d:0s"/><circle cx="${p0[0]}" cy="${p0[1]}" r="3.2"/>`}
function padStroke(id,pts){const P=PADS[id],el=padEl(id);if(!P||P.done)return;const ink=el.querySelector('.ink');const ref=samp(P.ch)[P.k];
 const clr=()=>{ink.setAttribute('d','');ink.classList.remove('bad')};
 if(!ref){clr();return}
 let len=0;for(let i=1;i<pts.length;i++)len+=dist(pts[i],pts[i-1]);
 if(len<3&&ref.L>12){clr();return}
 const u=resamp(pts,NP);let m=0;for(let i=0;i<NP;i++)m+=dist(u[i],ref.pts[i]);m/=NP;
 const tol=ref.L<18?1.5:1,ok=m<17*tol&&dist(u[0],ref.pts[0])<26*tol&&dist(u[NP-1],ref.pts[NP-1])<26*tol;
 if(ok){el.querySelector('.dn').insertAdjacentHTML('beforeend',`<path d="${STK[P.ch][P.k]}"/>`);P.k++;P.missK=0;clr();el.querySelector('.ht').innerHTML='';
  if(P.k>=STK[P.ch].length){P.done=true;if(P.onDone)setTimeout(()=>P.onDone(P.miss),250)}}
 else{P.miss++;P.missK++;ink.classList.add('bad');setTimeout(clr,380);if(P.missK>=2||P.mode==='trace')padHint(id)}}
function afterRender(){document.querySelectorAll('svg[data-pad]').forEach(el=>{const P=PADS[el.dataset.pad];if(P&&P.auto&&!el.dataset.init){el.dataset.init=1;if(P.mode==='show')animInto(el.querySelector('.dn'),P.ch);else padWatch(el.dataset.pad)}})}
function ptOf(el,e){const r=el.getBoundingClientRect();return[(e.clientX-r.left)/r.width*109,(e.clientY-r.top)/r.height*109]}
document.addEventListener('pointerdown',e=>{const el=e.target.closest&&e.target.closest('svg[data-pad]');if(!el)return;const P=PADS[el.dataset.pad];if(!P||P.done&&!P.anim)return;
 if(P.anim){P.anim=false;P.k=0;P.done=false;el.querySelector('.dn').innerHTML=''}
 e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}drawing={el,id:el.dataset.pad,pts:[ptOf(el,e)]}});
document.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();drawing.pts.push(ptOf(drawing.el,e));drawing.el.querySelector('.ink').setAttribute('d','M'+drawing.pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join('L'))},{passive:false});
const endDraw=()=>{if(!drawing)return;const d=drawing;drawing=null;padStroke(d.id,d.pts)};
document.addEventListener('pointerup',endDraw);document.addEventListener('pointercancel',endDraw);
const padBtns=id=>`<div class="pbtn"><button class="btn" data-act="pwatch:${id}">▶ Stroke order</button><button class="btn" data-act="pclear:${id}">Clear</button></div>`;
const lpDone=m=>{toast(m===0?'Perfect stroke order!':`Done, with ${m} slip${m>1?'s':''}. Try it once more?`);setTimeout(()=>padClear('lp'),1400)};
const mpDone=m=>{toast(m===0?'Perfect stroke order!':`Done, with ${m} slip${m>1?'s':''}.`);setTimeout(()=>padClear('mp'),1400)};

function startSes(mode,u){let qs=[];
 if(mode==='review'){qs=dueIds().slice(0,20).map(qFor).filter(Boolean);if(!qs.length){toast('No reviews due. Nice work!');return}}
 else if(mode==='weak'){qs=shuffle(weakIds().slice(0,10).flatMap(id=>[qFor(id),qFor(id)]).filter(Boolean));if(!qs.length){toast('No weak items right now');return}}
 else if(mode==='fix'){const ids=U(u.id).fix||[];qs=shuffle(ids.flatMap(id=>[qFor(id),qFor(id)]).filter(Boolean));if(!qs.length){U(u.id).fix=[];save();startSes('test',u);return}}
 else qs=build(u,mode);
 if(u&&mode!=='fix'&&!U(u.id).l){U(u.id).l=1}

 if(q.passage)body+=`<div class="psg">${esc(q.passage)}</div>`;
 if(q.listen)body+=`<button class="listen" data-say="${esc(q.listen)}" aria-label="Play audio">${IC.spk}</button>`;
 if(q.pr)body+=`<div class="qpr">${esc(q.pr)}</div>${q.pr2?`<div class="qpr2">${esc(q.pr2)}</div>`:''}`;
 if(q.big)body+=`<div class="qbig ${q.bigW?'w':''} ${q.bigS?'sm2':''}">${esc(q.big)}</div>${q.bigRom&&ROM?`<div class="rom" style="font-size:17px;margin-bottom:12px">${esc(toRomaji(q.big))}</div>`:''}`;
 if(q.rom)body+=`<div class="qbig w" style="font-family:var(--jp);font-weight:700">${esc(q.rom)}</div>`;
 if(q.sent)body+=`<div class="qbig s">${esc(q.sent).replace('＿','<span class="blank"></span>')}${ROM?`<span class="rom">${esc(toRomaji(q.sent).replace('＿','___'))}</span>`:''}</div>`;
 let ansH='';
 if(q.kind==='mc'){ansH=`<div class="opts">${q.opts.map((o,k)=>{let cl='';if(ans){if(o===q.a)cl='right';else if(o===ans.given)cl='wrong'}
   return`<button class="opt ${q.optJP?(q.optS?'jps':'jp'):''} ${cl}" data-act="opt:${k}" ${ans?'disabled':''}><span class="k">${k+1}</span>${esc(o)}${q.optJP&&q.showRom&&ROM?`<span class="rom">${esc(toRomaji(o))}</span>`:''}</button>`}).join('')}</div>`}
 else if(q.kind==='type'){const ph=q.mode==='rom'?'Type in romaji…':q.mode==='num'?'Type digits…':q.mode==='de'?'Type in German…':'Type in romaji or kana…';
  ansH=`<input class="tin ${ans?(ans.ok?'right':'wrong'):''}" id="tin" autocomplete="off" autocapitalize="off" spellcheck="false" ${q.mode==='num'?'inputmode="numeric"':''} placeholder="${ph}" value="${ans?esc(ans.given):''}" ${ans?'disabled':''} aria-label="Your answer">${q.mode==='de'&&!ans?`<div class="uml">${['ä','ö','ü','ß'].map(c=>`<button class="tl" data-act="ins:${c}" aria-label="Insert ${c}">${c}</button>`).join('')}</div>`:''}${q.mode==='jp'?`<div class="prev" id="prev">${ans?esc(toKana(ans.given)):''}</div>`:''}${ans?'':`<div class="act"><button class="btn ai big" data-act="check">Check</button></div>`}`}
 else if(q.kind==='build'){const used=new Set(SES.built);
  ansH=`<div class="slot">${SES.built.map((bi,k)=>`<button class="tl" data-act="untile:${k}" ${ans?'disabled':''}>${esc(q.bank[bi])}${ROM?`<small>${esc(toRomaji(q.bank[bi]))}</small>`:''}</button>`).join('')||'<span class="lbl">Tap the words below in order</span>'}</div><div class="bank">${q.bank.map((t,k)=>`<button class="tl ${used.has(k)?'used':''}" data-act="tile:${k}" ${ans||used.has(k)?'disabled':''}>${esc(t)}${ROM?`<small>${esc(toRomaji(t))}</small>`:''}</button>`).join('')}</div>${ans?'':`<div class="act"><button class="btn ai big" data-act="check" ${SES.built.length?'':'disabled'}>Check</button></div>`}`}
 else if(q.kind==='write'){const md=ans?'show':(q.trace?'trace':'recall');ansH=padHTML('sp',q.ch,md,{onDone:m=>{if(!SES.ans)grade(m<=allowMiss(q.ch),m?m+' slips':'clean')}})+(ans?'':`<div class="pbtn"><button class="btn" data-act="phint:sp">Hint</button><button class="btn" data-act="pclear:sp">Clear</button><button class="btn ghost" data-act="giveup">Show me</button></div><p class="fine">Write each stroke in the right order and direction. ${q.trace?'Trace the grey guide.':'From memory: no guide this time.'}</p>`)}

  fb=`<div class="fb ${ans.ok?'ok':'no'}" role="status"><div class="m"><h3>${ans.ok?rnd(['Correct!','Nice!','Exactly.','Well done.','That\'s it.']):'Not quite.'}</h3>${ans.ok?'':`<p style="margin-bottom:6px">Correct answer: <b>${esc(corr)}</b></p>`}<p>${q.why||''}</p></div>${q.audio?spk(q.audio):''}<button class="btn ${ans.ok?'ai':'pri'}" data-act="next">Continue</button></div>`}

function grade(ok,given){const q=cur();
 if(SES.mode==='mock'){const sc=SES.secs[q.sec]||(SES.secs[q.sec]=[0,0]);sc[1]++;if(ok){sc[0]++;SES.ok++;SES.xp++;addXP(1)}else{SES.bad++;if(q.id)SES.missed.add(q.id)}SES.ans=null;save();nextQ();return}
 SES.ans={ok,given};const m=SES.mode;
 const dk=dkey();S.acc=S.acc||{};const ac=S.acc[dk]||(S.acc[dk]=[0,0]);ac[1]++;S.miss=S.miss||{};
 if(ok){SES.ok++;ac[0]++;S.okT=(S.okT||0)+1;const x={practice:2,test:3,review:2,fix:2,weak:2}[m];SES.xp+=x;addXP(x);if(m==='weak'&&q.id&&S.miss[q.id]&&!SES.first[q.id]){SES.first[q.id]=1;S.miss[q.id]=Math.max(0,S.miss[q.id]-1)}}else{SES.bad++;if(q.id){SES.missed.add(q.id);S.miss[q.id]=(S.miss[q.id]||0)+1}}
 if(m==='review')S.revs=(S.revs||0)+1;
 if(m==='review'&&q.id&&!SES.first[q.id]){SES.first[q.id]=1;srsUpd(q.id,ok)}
 if(!ok&&(m==='practice'||m==='fix'||m==='weak'||(m==='review'&&!q.rq))){const c=Object.assign({},q,{rq:1});if(c.opts)c.opts=shuffle(c.opts);if(c.bank)c.bank=shuffle(c.bank);SES.qs.splice(Math.min(SES.i+3,SES.qs.length),0,c)}
 if(q.audio&&(q.listen||ok))say(q.audio);
 save();render();const b=$('.fb .btn');if(b)b.focus({preventScroll:true})}
function check(){const q=cur();if(SES.ans)return;
 if(q.kind==='type'){const raw=($('#tin').value||'').trim();if(!raw)return;let ok=false;
  if(q.mode==='num')ok=raw.replace(/\s/g,'')===q.a[0];
  else if(q.mode==='de')ok=q.a.some(a=>normDE(a)===normDE(raw));
  else{const uk=normK(/[a-z]/i.test(raw)?toKana(raw):raw,q.len);const acc=new Set([...q.a.map(a=>normK(a,q.len)),...(q.ar||[]).map(r=>normK(toKana(r),q.len))]);
   ok=acc.has(uk)||(q.mode==='rom'&&(q.ar||[]).some(r=>r.replace(/\s/g,'')===raw.toLowerCase().replace(/\s/g,'')))}
  grade(ok,raw)}
 else if(q.kind==='build'){const g=SES.built.map(i=>q.bank[i]).join(' ');grade(g===q.a,g)}}
function nextQ(){SES.ans=null;SES.built=[];SES.i++;if(SES.i>=SES.qs.length)return finish();render()}

function deForms(v){if(v[2])return v[2];const inf=v[0],st=inf.replace(/e?n$/,''),ins=/[td]$/.test(st)||/[^lrhmnaeiouäöü][mn]$/.test(st),sz=/[sßzx]$/.test(st);

const DEDR={
 gender:(u,j,id)=>{const[a,n,en]=u.drill.L[j];return{id,kind:'mc',label:'der, die or das?',big:n,bigW:1,opts:['der','die','das'],a,optS:1,gend:1,audio:a+' '+n,why:`<b class="g-${a}">${a}</b> ${esc(n)} = the ${esc(en)}`}},
 deverb:(u,j,id)=>{const v=u.drill.L[j],f=deForms(v),p=Math.random()*6|0,a=f[p];const reg=v[2]?deForms([v[0],v[1]]):[];
  const opts=uniq4([a,...(reg[p]&&reg[p]!==a?[reg[p]]:[]),...shuffle(f.filter(x=>x!==a))],[v[0].replace(/e?n$/,'')+'est',v[0].replace(/e?n$/,'')+'e']);

  return{id,kind:'mc',label:'Listen. Which number did you hear?',listen:w,opts:shuffle(ns.map(String)),a:String(n),audio:w,why:`${w} = <b>${n}</b>`}},

 ['a1','A1 complete','Pass the A1 final exam','A1','d4',()=>passed(UI.ddx)],

 de:{id:'de',name:'German',native:'Deutsch',sub:'Everyday, travel and work German · CEFR A1',units:DE_UNITS,stages:DE_STAGES,badges:BADGES_DE,mocks:MOCKS_DE,exam:'Goethe-style'}};
function applyCourse(){const C=CFG[CID];UNITS.length=0;UNITS.push(...C.units);STAGES.length=0;STAGES.push(...C.stages);BADGES.length=0;BADGES.push(...C.badges);
 for(const k in MOCKS)delete MOCKS[k];Object.assign(MOCKS,C.mocks);document.documentElement.dataset.course=CID;if(CID==='de')S.romaji=false}
function courseSummary(c){let st=c===CID?S:null;if(!st){try{st=JSON.parse(localStorage.getItem(c==='de'?'michi.de.v1':'michi.v1')||'null')}catch(e){}}
 const us=CFG[c].units,p=st&&st.u?us.filter(u=>st.u[u.id]&&st.u[u.id].pass).length:0;return{p,n:us.length}}
function coursesModal(){$('#modal').innerHTML=`<div class="ov" data-act="close"><div class="dlg" role="dialog" aria-modal="true" aria-label="Choose a course"><h2>Your courses</h2><div class="crsl">${Object.values(CFG).map(C=>{const s=courseSummary(C.id);
 return`<button class="crsc ${C.id===CID?'on':''} st-${C.id==='ja'?'s1':'d1'}" data-act="course:${C.id}"><span class="g">${C.native}</span><span><b>${C.name}${C.id===CID?' · current':''}</b><span>${C.sub}</span><span class="cp"><i><b style="width:${s.p/s.n*100}%"></b></i>${s.p} of ${s.n} units</span></span></button>`}).join('')}</div>
 <p class="fine">Each course keeps its own path, reviews, streak and progress, all saved to your account.</p><div style="text-align:right;margin-top:8px"><button class="btn" data-act="close">Close</button></div></div></div>`}
async function setCourse(c){$('#modal').innerHTML='';if(!CFG[c]||c===CID)return;flushNow();const keep={theme:S.theme,goal:S.goal,rate:S.rate};
 CID=c;try{localStorage.setItem('michi.course',c)}catch(e){}LSK=c==='de'?'michi.de.v1':'michi.v1';FKEY=c==='de'?'d':'s';UKEY=c==='de'?'du':'upd';
 let n=def();try{const v=localStorage.getItem(LSK);if(v)n=Object.assign(def(),JSON.parse(v))}catch(e){}if(!n.upd)Object.assign(n,keep);
 S=n;dirty=false;SES=null;LS=null;applyCourse();VIEW='home';render();window.scrollTo(0,0);toast(`Switched to ${CFG[c].name}`);
 if(fbUser&&FB){store.ref=null;await linkAccount(fbUser);render()}else if(store.kind==='claude'){store.ref=null;initStore()}}

 return`<button class="back" data-act="home">${IC.back} Back to path</button><div class="ch"><h1 style="font-size:clamp(30px,4.4vw,44px);margin:4px 0 6px">Grammar tables</h1><p class="fine">Everything you need for A1 on one page. Tap any German word to hear it.</p>
 <div class="gtw">${DE_GRAMMAR.map(([t,h,rows,note])=>`<section class="pc"><h2>${t}</h2><div class="scroll"><table class="tbl gt"><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>(SKIP[t]||[]).includes(i)||!c||c==='–'?`<td>${esc(c)}</td>`:`<td><button class="gsay" data-say="${esc(c)}">${esc(c)}</button></td>`).join('')}</tr>`).join('')}</tbody></table></div>${note?`<p class="fine" style="margin:10px 0 0">${esc(note)}</p>`:''}</section>`).join('')}</div></div>`}

applyCourse();checkBadges();render();initStore();initCloud();
}
