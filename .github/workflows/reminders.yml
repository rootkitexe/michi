name: Daily reminders
on:
  schedule:
    - cron: '7 * * * *'   # every hour; each learner gets one reminder a day at their chosen local time
  workflow_dispatch: {}
concurrency: reminders
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --no-audit --no-fund --prefix scripts
      - name: Send reminders
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/send-reminders.mjs
